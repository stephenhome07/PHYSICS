<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Physics Student - Firebase</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
</head>
<body class="bg-slate-50 min-h-screen text-slate-800">
  <div id="root"></div>
  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyAzHIgH35NDtvCRAULOE3_TX9aBa9b_qcs",
      authDomain: "hoyuphysics.firebaseapp.com",
      projectId: "hoyuphysics",
      storageBucket: "hoyuphysics.firebasestorage.app",
      messagingSenderId: "409265879054",
      appId: "1:409265879054:web:ebf3bdf94c9025d6b6e45f"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();
    const SS_STUDENT = "physics_student_id";
    const SS_ADMIN = "physics_student_admin";

    function el(tag, attrs, children) {
      const n = document.createElement(tag);
      if (attrs) Object.entries(attrs).forEach(([k, v]) => {
        if (k === "className") n.className = v;
        else if (k === "onClick") n.onclick = v;
        else if (k === "value") n.value = v;
        else if (v != null) n.setAttribute(k, v);
      });
      (children || []).forEach(c => {
        if (c == null) return;
        n.appendChild(typeof c === "string" ? document.createTextNode(c) : c);
      });
      return n;
    }
    function hasPin(stu) { return stu && stu.pin != null && String(stu.pin).trim() !== ""; }
    async function getAdminPin() {
      const snap = await db.collection("config").doc("app").get();
      return (snap.exists && snap.data().adminPin) ? String(snap.data().adminPin) : "1357";
    }
    async function loadAllStudents() {
      const snap = await db.collection("students").get();
      const list = [];
      snap.forEach(d => list.push(Object.assign({}, d.data(), { id: d.id })));
      list.sort(function(a,b){ return String(a.class||"").localeCompare(String(b.class||"")) || (Number(a.num)||0)-(Number(b.num)||0); });
      return list;
    }
    async function loadStudent(id) {
      const snap = await db.collection("students").doc(id).get();
      return snap.exists ? Object.assign({}, snap.data(), { id: snap.id }) : null;
    }
    async function loadSubScores(studentId, sub) {
      const snap = await db.collection("scores").doc(studentId).collection(sub).get();
      const out = {}; snap.forEach(function(d){ out[d.id] = d.data(); }); return out;
    }
    async function loadMapTitles(col) {
      const snap = await db.collection(col).get();
      const out = {}; snap.forEach(function(d){ out[d.id] = (d.data()||{}).title || d.id; }); return out;
    }
    function summarizePaper(data) {
      const scores = (data && data.scores && typeof data.scores === "object") ? data.scores : data;
      if (!scores || typeof scores !== "object") return { preview: "-" };
      const keys = Object.keys(scores).filter(function(k){ return ["updatedAt","remakeStatus","remarks","gradingDate","remakeDate","_id"].indexOf(k)<0; });
      var answered = 0;
      keys.forEach(function(k){ var v=scores[k]; if (v!==undefined&&v!==null&&String(v).trim()!=="") answered++; });
      return { preview: answered ? answered + " 題有紀錄" : "-" };
    }
    function labelStudent(s) { return (s.class||"")+"-"+(s.num!=null?s.num:"")+" "+(s.name||"")+" ("+s.id+")"; }

    async function renderLogin() {
      var root = document.getElementById("root");
      root.innerHTML = "";
      root.appendChild(el("div",{className:"text-center py-20 text-slate-400"},["載入中…"]));
      var students = [];
      try { students = await loadAllStudents(); }
      catch(e) { root.innerHTML=""; root.appendChild(el("div",{className:"max-w-md mx-auto mt-20 p-6 bg-white border rounded-2xl text-red-600"},["Error: "+e.message])); return; }
      root.innerHTML = "";
      var opts = [el("option",{value:""},["— 請選擇 —"])];
      students.forEach(function(s){ opts.push(el("option",{value:s.id},[labelStudent(s)])); });
      var card = el("div",{className:"max-w-md mx-auto mt-12 bg-white rounded-2xl shadow-lg border p-8"},[
        el("div",{className:"text-center mb-6"},[
          el("h1",{className:"text-2xl font-black text-indigo-700"},["Physics 學生"]),
          el("p",{className:"text-sm text-slate-500 mt-1"},["選擇自己 → 輸入 PIN（首次請自設）"])
        ]),
        el("label",{className:"text-xs font-bold text-slate-500"},["學生"]),
        el("select",{id:"sid",className:"w-full mt-1 mb-3 border rounded-lg px-3 py-2 text-sm"}, opts),
        el("div",{id:"pinArea"}),
        el("button",{className:"w-full mt-4 bg-indigo-600 text-white font-bold py-2.5 rounded-lg", onClick: async function(){
          var sid = document.getElementById("sid").value;
          if (!sid) return alert("請先選擇學生");
          var stu = await loadStudent(sid);
          if (!stu) return alert("找不到");
          if (!hasPin(stu)) {
            var p1 = (document.getElementById("newPin")||{}).value||"";
            var p2 = (document.getElementById("newPin2")||{}).value||"";
            if (!/^\d{4}$/.test(p1)) return alert("請設定 4 位數字 PIN");
            if (p1 !== p2) return alert("兩次 PIN 不一致");
            await db.collection("students").doc(sid).set({ pin: p1, updatedAt: new Date().toISOString() }, { merge:true });
            sessionStorage.setItem(SS_STUDENT, sid); sessionStorage.removeItem(SS_ADMIN); renderApp(); return;
          }
          var pin = (document.getElementById("pin")||{}).value||"";
          if (String(stu.pin) !== String(pin)) return alert("PIN 不正確");
          sessionStorage.setItem(SS_STUDENT, sid); sessionStorage.removeItem(SS_ADMIN); renderApp();
        }},["進入"]),
        el("button",{className:"w-full mt-3 text-xs text-slate-400", onClick: async function(){
          var code = prompt("Admin 密語"); if (code==null) return;
          try {
            if (String(code) !== String(await getAdminPin())) return alert("密語錯誤");
            sessionStorage.setItem(SS_ADMIN,"1");
            var pick = prompt("學生 ID", students[0]?students[0].id:"");
            if (!pick) return;
            if (!(await loadStudent(pick.trim()))) return alert("找不到");
            sessionStorage.setItem(SS_STUDENT, pick.trim()); renderApp();
          } catch(e) { alert(e.message); }
        }},["Admin 模式（教師）"])
      ]);
      root.appendChild(card);
      var pinArea = document.getElementById("pinArea");
      async function refreshPinUI() {
        pinArea.innerHTML = "";
        var sid = document.getElementById("sid").value; if (!sid) return;
        var stu = students.find(function(s){return s.id===sid;}) || await loadStudent(sid); if (!stu) return;
        if (!hasPin(stu)) {
          pinArea.appendChild(el("div",{className:"bg-amber-50 border border-amber-200 rounded-xl p-3 space-y-2"},[
            el("p",{className:"text-xs text-amber-800 font-bold"},["首次登入：請設定你的 4 位 PIN"]),
            el("input",{id:"newPin",type:"password",maxlength:"4",inputmode:"numeric",className:"w-full border rounded-lg px-3 py-2",placeholder:"新 PIN"}),
            el("input",{id:"newPin2",type:"password",maxlength:"4",inputmode:"numeric",className:"w-full border rounded-lg px-3 py-2",placeholder:"再輸入一次"})
          ]));
        } else {
          pinArea.appendChild(el("div",{},[
            el("label",{className:"text-xs font-bold text-slate-500"},["PIN"]),
            el("input",{id:"pin",type:"password",maxlength:"4",inputmode:"numeric",className:"w-full mt-1 border rounded-lg px-3 py-2 text-lg",placeholder:"****"})
          ]));
        }
      }
      document.getElementById("sid").onchange = refreshPinUI;
    }

    async function renderApp() {
      var sid = sessionStorage.getItem(SS_STUDENT); if (!sid) return renderLogin();
      var isAdmin = sessionStorage.getItem(SS_ADMIN)==="1";
      var root = document.getElementById("root");
      root.innerHTML = ""; root.appendChild(el("div",{className:"text-center py-20 text-slate-400"},["載入中…"]));
      try {
        var student = await loadStudent(sid);
        if (!student) { sessionStorage.removeItem(SS_STUDENT); return renderLogin(); }
        var quizzes = await loadSubScores(sid,"quizzes");
        var exams = await loadSubScores(sid,"exams");
        var homeworks = await loadSubScores(sid,"homeworks");
        var pastpapers = await loadSubScores(sid,"pastpapers");
        var quizTitles = await loadMapTitles("quizMaps");
        var examTitles = await loadMapTitles("examMaps");
        var hwTitles = await loadMapTitles("homeworkMaps");
        var ppTitles = await loadMapTitles("pastpaperMaps");
        root.innerHTML = "";
        var header = el("header",{className:"bg-indigo-600 text-white px-4 py-5"},[
          el("div",{className:"max-w-3xl mx-auto flex flex-wrap justify-between gap-3"},[
            el("div",{},[
              el("div",{className:"text-xs text-indigo-100"},[isAdmin?"Admin":"學生"]),
              el("div",{className:"text-xl font-black"},[(student.name||"")+" ("+student.id+")"]),
              el("div",{className:"text-sm text-indigo-100"},[(student.class||"")+" No."+(student.num!=null?student.num:"")])
            ]),
            el("button",{className:"text-xs bg-white/20 px-3 py-1.5 rounded-lg",onClick:function(){sessionStorage.clear();renderLogin();}},["登出"])
          ])
        ]);
        var main = el("main",{className:"max-w-3xl mx-auto p-4 space-y-4"});
        function section(title, scoresObj, titles) {
          var ids = Object.keys(scoresObj||{}).sort();
          var box = el("div",{className:"bg-white rounded-2xl border p-4"},[el("h2",{className:"font-bold mb-3"},[title])]);
          if (!ids.length) { box.appendChild(el("p",{className:"text-sm text-slate-400"},["暫無紀錄"])); return box; }
          var ul = el("div",{className:"space-y-2"});
          ids.forEach(function(id){
            var sum = summarizePaper(scoresObj[id]);
            var st = scoresObj[id] && scoresObj[id].remakeStatus;
            ul.appendChild(el("div",{className:"flex justify-between text-sm border rounded-xl px-3 py-2 bg-slate-50"},[
              el("div",{},[el("div",{className:"font-semibold"},[titles[id]||id]), el("div",{className:"text-[11px] text-slate-400"},[id+(st?" · "+st:"")])]),
              el("div",{className:"text-indigo-600 font-bold text-xs"},[sum.preview])
            ]));
          });
          box.appendChild(ul); return box;
        }
        main.appendChild(section("功課", homeworks, hwTitles));
        main.appendChild(section("小測", quizzes, quizTitles));
        main.appendChild(section("大考", exams, examTitles));
        main.appendChild(section("歷屆試題", pastpapers, ppTitles));
        root.appendChild(header); root.appendChild(main);
      } catch(e) {
        root.innerHTML=""; root.appendChild(el("div",{className:"max-w-md mx-auto mt-20 bg-white border rounded-2xl p-6 text-center"},[
          el("p",{className:"text-red-600 font-bold"},["Error"]), el("p",{className:"text-sm"},[e.message]),
          el("button",{className:"text-indigo-600 font-bold mt-3",onClick:function(){sessionStorage.clear();renderLogin();}},["Back"])
        ]));
      }
    }
    if (sessionStorage.getItem(SS_STUDENT)) renderApp(); else renderLogin();
  </script>
</body>
</html>
