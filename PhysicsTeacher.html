function QuizSummaryView({ activeStudents, quizMaps, currentCohort }) {
  const available = useMemo(
    () => Object.keys(quizMaps || {}).filter(id => quizVisibleForCohort(quizMaps[id], currentCohort)).sort(),
    [quizMaps, currentCohort]
  );
  const [included, setIncluded] = useState({});
  const [scores, setScores] = useState({}); // sid -> { quizId -> record }
  const [loading, setLoading] = useState(false);

  useEffect(() => {
    const o = {};
    available.forEach(id => { o[id] = included[id] !== false; });
    // keep previous toggles when possible
    setIncluded(prev => {
      const next = {};
      available.forEach(id => { next[id] = prev[id] !== undefined ? prev[id] : true; });
      return next;
    });
  }, [available.join("|")]);

  const selectedIds = useMemo(() => available.filter(id => included[id]), [available, included]);

  // 懶載入：只拉有勾選的小測
  useEffect(() => {
    if (!activeStudents.length || !selectedIds.length) {
      setScores({});
      return;
    }
    let cancelled = false;
    (async () => {
      setLoading(true);
      try {
        const merged = {};
        activeStudents.forEach(s => { merged[s.id] = {}; });
        for (const qid of selectedIds) {
          const part = await loadQuizScoresForQuiz(activeStudents.map(s => s.id), qid);
          Object.keys(part).forEach(sid => {
            if (!merged[sid]) merged[sid] = {};
            Object.assign(merged[sid], part[sid]);
          });
        }
        if (!cancelled) setScores(merged);
      } catch (e) { console.warn(e); }
      if (!cancelled) setLoading(false);
    })();
    return () => { cancelled = true; };
  }, [selectedIds.join("|"), activeStudents.map(s => s.id).join(",")]);

  const quizMax = useMemo(() => {
    const m = {};
    available.forEach(id => {
      m[id] = (quizMaps[id]?.questions || []).reduce((a, q) => a + (q.max || 0), 0);
    });
    return m;
  }, [available, quizMaps]);

  const scoreOf = (sid, qid) => {
    const rec = scores[sid]?.[qid];
    const map = quizMaps[qid];
    if (!rec || !map) return null;
    let any = false, total = 0;
    (map.questions || []).forEach(q => {
      const raw = rec[q.id];
      if (raw === undefined || raw === null || String(raw).trim() === "") return;
      any = true;
      const sc = quizQuestionScore(q, raw);
      if (sc != null) total += sc;
    });
    return any ? total : null;
  };

  const rows = useMemo(() => {
    return activeStudents.map(s => {
      const qs = {};
      let sumPct = 0, n = 0;
      selectedIds.forEach(qid => {
        const sc = scoreOf(s.id, qid);
        qs[qid] = sc;
        if (sc != null && quizMax[qid] > 0) {
          sumPct += (sc / quizMax[qid]) * 100;
          n++;
        }
      });
      return {
        ...s,
        quizScores: qs,
        average: n > 0 ? (sumPct / n) : null
      };
    });
  }, [activeStudents, selectedIds, scores, quizMax, quizMaps]);

  const exportExcel = () => {
    const header = ["班別", "號", "姓名", "學生ID", ...selectedIds.map(id => id + "分數"), ...selectedIds.map(id => id + "得分率"), "平均得分率"];
    const maxRow = ["", "", "滿分", "", ...selectedIds.map(id => quizMax[id] || 0), ...selectedIds.map(() => "100"), "100"];
    const body = rows.map(s => {
      const scoresCols = selectedIds.map(id => s.quizScores[id] == null ? "" : s.quizScores[id]);
      const pctCols = selectedIds.map(id => {
        const sc = s.quizScores[id];
        if (sc == null || !quizMax[id]) return "";
        return ((sc / quizMax[id]) * 100).toFixed(1);
      });
      return [s.class, s.num, s.name, s.id, ...scoresCols, ...pctCols, s.average == null ? "" : s.average.toFixed(1)];
    });
    const csv = [header, maxRow, ...body].map(r => r.map(c => {
      const x = String(c ?? "");
      return /[",\n]/.test(x) ? `"${x.replace(/"/g, '""')}"` : x;
    }).join(",")).join("\n");
    const blob = new Blob(["\uFEFF" + csv], { type: "text/csv;charset=utf-8;" });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "quiz_summary.csv";
    a.click();
  };

  const cellCls = (sc, max) => {
    if (sc == null || !max) return "";
    const pct = (sc / max) * 100;
    if (pct < 40) return "bg-rose-50 text-rose-700";
    if (pct < 60) return "bg-amber-50 text-amber-800";
    return "";
  };

  return (
    <div className="bg-white rounded-2xl border p-4 space-y-3">
      <div className="flex flex-wrap items-center justify-between gap-2">
        <div>
          <h2 className="font-bold text-lg">小測分數表</h2>
          <p className="text-xs text-slate-500">勾選要顯示／計入平均的小測；黃底 40–60%、紅底 &lt;40%。懶載入僅讀勾選卷。</p>
        </div>
        <div className="flex gap-2 items-center">
          {loading && <span className="text-xs text-slate-400">載入成績中…</span>}
          <button className="text-sm font-bold px-4 py-2 rounded-lg bg-emerald-600 text-white" onClick={exportExcel}>匯出 Excel (CSV)</button>
        </div>
      </div>
      <div className="flex flex-wrap gap-2">
        {available.map(id => (
          <label key={id} className={`text-sm font-bold flex items-center gap-1.5 border-2 rounded-lg px-3 py-1.5 cursor-pointer ${included[id]?"border-indigo-400 bg-indigo-50":"border-slate-200"}`}>
            <input type="checkbox" checked={!!included[id]} onChange={() => setIncluded(p => ({ ...p, [id]: !p[id] }))} />
            {id}
            <span className="text-xs font-normal text-slate-400">/{quizMax[id]}</span>
          </label>
        ))}
        {!available.length && <span className="text-slate-400 text-sm">此群組尚無小測藍圖</span>}
      </div>
      <div className="overflow-auto max-h-[70vh]">
        <table className="min-w-full text-sm">
          <thead className="sticky top-0 bg-slate-50">
            <tr>
              <th className="text-left px-2 py-2">班</th>
              <th className="text-left px-2 py-2">號</th>
              <th className="text-left px-2 py-2">姓名</th>
              {selectedIds.map(id => (
                <th key={id} className="text-center px-2 py-2 text-xs">
                  {id}
                  <div className="text-[10px] font-normal text-slate-400">/{quizMax[id]}</div>
                </th>
              ))}
              <th className="text-center px-2 py-2 text-xs">平均%</th>
            </tr>
          </thead>
          <tbody>
            {rows.map(s => (
              <tr key={s.id} className="border-t">
                <td className="px-2 py-1">{s.class}</td>
                <td className="px-2 py-1">{s.num}</td>
                <td className="px-2 py-1 font-semibold">{s.name}</td>
                {selectedIds.map(id => {
                  const sc = s.quizScores[id];
                  return (
                    <td key={id} className={`px-2 py-1 text-center font-bold ${cellCls(sc, quizMax[id])}`}>
                      {sc == null ? "—" : sc}
                    </td>
                  );
                })}
                <td className={`px-2 py-1 text-center font-bold ${s.average != null && s.average < 40 ? "text-rose-600" : s.average != null && s.average < 60 ? "text-amber-600" : "text-slate-800"}`}>
                  {s.average == null ? "—" : s.average.toFixed(1)}
                </td>
              </tr>
            ))}
          </tbody>
        </table>
      </div>
    </div>
  );
}



function ExamInputAnalysisView({ activeStudents, examMaps, examScores, setExamScores, currentCohort }) {
  const examIds = useMemo(
    () => Object.keys(examMaps || {}).filter(id => examVisibleForCohort(examMaps[id], currentCohort)).sort(),
    [examMaps, currentCohort]
  );
  const [selectedExam, setSelectedExam] = useState(examIds[0] || "");
  const [selectedStudentId, setSelectedStudentId] = useState("");
  const [saveStatus, setSaveStatus] = useState("idle");
  const [loading, setLoading] = useState(false);
  const [sortMode, setSortMode] = useState("question"); // question | pAsc | pDesc
  const inputRefs = useRef({});
  const timer = useRef(null);

  // 補考專區
  const [makeup, setMakeup] = useState({}); // sid -> { category, remark, topics: {topicId: {done, label, pct}} }
  const [makeupFocus, setMakeupFocus] = useState(""); // selected student in makeup panel
  const [mkMc, setMkMc] = useState(10);
  const [mkLq, setMkLq] = useState(0);
  const [mkLevel, setMkLevel] = useState("中");
  const [makeupSaving, setMakeupSaving] = useState(false);

  const [aiMc, setAiMc] = useState(5);
  const [aiLq, setAiLq] = useState(3);
  const [aiLevel, setAiLevel] = useState("中");
  const [aiExtra, setAiExtra] = useState({ practice: true, review: true, explainImg: false, ppt: false, notes: false });
  const [aiSelected, setAiSelected] = useState([]);

  useEffect(() => {
    if (examIds.length && !examIds.includes(selectedExam)) setSelectedExam(examIds[0] || "");
  }, [examIds]);

  const activeIdsKey = useMemo(() => activeStudents.map(s => s.id).join(","), [activeStudents]);
  const [loadInfo, setLoadInfo] = useState("");

  useEffect(() => {
    if (!selectedExam || !activeStudents.length) return;
    let cancelled = false;
    (async () => {
      setLoading(true);
      setLoadInfo("");
      try {
        const part = await loadExamScoresForExam(activeStudents.map(s => s.id), selectedExam);
        let mk = {};
        try { mk = await loadExamMakeup(selectedExam); } catch (e) { console.warn("makeup", e); }
        if (cancelled) return;
        const meta = part.__meta || {};
        delete part.__meta;
        setExamScores(prev => {
          const next = { ...prev };
          // 只寫入「有讀到」的文件；讀不到時保留畫面既有資料，避免一次失敗清空全班
          Object.keys(part).forEach(sid => {
            next[sid] = { ...(next[sid] || {}), ...(part[sid] || {}) };
          });
          // 若成功讀完且確認該生無此卷文件，才清掉（errors==0 時才做「明確沒有」清理）
          if ((meta.errors || 0) === 0) {
            activeStudents.forEach(s => {
              if (!part[s.id] || !part[s.id][selectedExam]) {
                if (next[s.id] && next[s.id][selectedExam]) {
                  const copy = { ...next[s.id] };
                  delete copy[selectedExam];
                  next[s.id] = copy;
                }
              }
            });
          }
          return next;
        });
        setMakeup(mk || {});
        setLoadInfo(`讀取 ${meta.found || 0}/${meta.tried || 0} 人有此卷成績` + (meta.errors ? `（${meta.errors} 次讀取失敗）` : ""));
      } catch (e) {
        console.warn(e);
        setLoadInfo("讀取失敗：" + (e.message || String(e)));
      }
      if (!cancelled) setLoading(false);
    })();
    return () => { cancelled = true; };
  }, [selectedExam, activeIdsKey]);

  const map = examMaps[selectedExam];
  const qList = map?.questions || [];

  const calcStudent = (sid) => {
    if (!map) return null;
    const rec = examScores[sid]?.[selectedExam] || {};
    // 建立不區分大小寫的 key 對照
    const recKeys = {};
    Object.keys(rec || {}).forEach(k => { if (k !== "updatedAt" && k !== "_id" && k !== "value") recKeys[String(k).toUpperCase()] = rec[k]; });
    let mcScore = 0, mcMax = 0, lqScore = 0, lqMax = 0, any = false;
    qList.forEach(q => {
      const max = q.max || 1;
      if (q.type === "MC") mcMax += max; else lqMax += max;
      let raw = rec[q.id];
      if (raw === undefined || raw === null || String(raw).trim() === "") {
        raw = recKeys[String(q.id).toUpperCase()];
      }
      if (raw === undefined || raw === null || String(raw).trim() === "") return;
      any = true;
      if (q.type === "MC") {
        if (q.ans) {
          const corrects = q.ans.toString().split(",").map(a => a.trim().toUpperCase());
          if (corrects.includes(String(raw).trim().toUpperCase())) mcScore += max;
        }
      } else {
        lqScore += parseFloat(raw) || 0;
      }
    });
    if (!any) return null;
    let weighted = 0;
    if (mcMax > 0 && lqMax > 0) weighted = (mcScore / mcMax) * 35 + (lqScore / lqMax) * 65;
    else if (mcMax > 0) weighted = (mcScore / mcMax) * 100;
    else if (lqMax > 0) weighted = (lqScore / lqMax) * 100;
    return { mcScore, mcMax, lqScore, lqMax, total: mcScore + lqScore, max: mcMax + lqMax, weighted };
  };

  const focusNext = (fromQid) => {
    const idx = qList.findIndex(q => q.id === fromQid);
    if (idx < 0 || idx >= qList.length - 1) return;
    const nextId = qList[idx + 1].id;
    setTimeout(() => {
      const el = inputRefs.current[nextId] || document.querySelector('[data-ex-qid="'+nextId+'"]');
      if (el) { el.focus(); if (el.select) el.select(); }
    }, 40);
  };

  const scheduleSave = (sid, examId, record) => {
    setSaveStatus("saving");
    if (timer.current) clearTimeout(timer.current);
    timer.current = setTimeout(async () => {
      try {
        await saveExamScore(sid, examId, record);
        setSaveStatus("saved");
        setTimeout(() => setSaveStatus(s => s === "saved" ? "idle" : s), 1500);
      } catch (e) { setSaveStatus("idle"); alert(e.message); }
    }, 600);
  };

  const setQVal = (qid, raw, q) => {
    if (!selectedStudentId || !selectedExam) return;
    let stored = raw;
    if (raw === "" || raw === null || raw === undefined) stored = "";
    else if (q.type === "MC") stored = String(raw).toUpperCase().replace(/[^A-D]/g, "").slice(0, 1);
    else stored = (raw === "" || isNaN(parseFloat(raw))) ? raw : parseFloat(raw);

    setExamScores(prev => {
      const prevRec = { ...(prev[selectedStudentId]?.[selectedExam] || {}) };
      const nextRec = { ...prevRec, [qid]: stored };
      const next = {
        ...prev,
        [selectedStudentId]: {
          ...(prev[selectedStudentId] || {}),
          [selectedExam]: nextRec
        }
      };
      scheduleSave(selectedStudentId, selectedExam, nextRec);
      return next;
    });
    if (stored !== "" && stored !== null) focusNext(qid);
  };

  const clearStudent = async () => {
    if (!selectedStudentId || !selectedExam) return;
    if (!confirm("清除此學生此考試全部成績？")) return;
    try {
      await deleteExamScore(selectedStudentId, selectedExam);
      setExamScores(prev => {
        const next = { ...prev };
        if (next[selectedStudentId]) {
          const copy = { ...next[selectedStudentId] };
          delete copy[selectedExam];
          next[selectedStudentId] = copy;
        }
        return next;
      });
    } catch (e) { alert(e.message); }
  };


  const persistExamMakeup = async (nextMap) => {
    setMakeupSaving(true);
    try {
      await saveExamMakeup(selectedExam, nextMap);
      setMakeup(nextMap);
    } catch (e) { alert(e.message); }
    setMakeupSaving(false);
  };


  // Analysis stats
  const attemptedStudents = useMemo(() => {
    return activeStudents.filter(s => {
      const rec = examScores[s.id]?.[selectedExam];
      if (!rec) return false;
      return qList.some(q => {
        const v = rec[q.id];
        return v !== undefined && v !== null && String(v).trim() !== "";
      });
    });
  }, [activeStudents, examScores, selectedExam, qList]);

  const qStats = useMemo(() => {
    if (!map) return [];
    return qList.map(q => {
      let totalScore = 0, attempts = 0;
      const counts = { A: 0, B: 0, C: 0, D: 0, Other: 0 };
      attemptedStudents.forEach(s => {
        const rec = examScores[s.id]?.[selectedExam];
        if (!rec) return;
        const val = rec[q.id];
        if (val === undefined || val === null || String(val).trim() === "") return;
        attempts++;
        if (q.type === "MC") {
          const ans = String(val).trim().toUpperCase();
          if (["A","B","C","D"].includes(ans)) counts[ans]++;
          else if (ans) counts.Other++;
          const sc = quizQuestionScore(q, val);
          if (sc != null) totalScore += sc;
        } else {
          totalScore += parseFloat(val) || 0;
        }
      });
      const pValue = attempts > 0 && q.max > 0 ? totalScore / (attempts * q.max) : null;
      let diag = "—", badgeColor = "text-slate-500 bg-slate-50 border-slate-200";
      if (pValue != null) {
        if (pValue < 0.40) { diag = "艱深"; badgeColor = "text-red-600 bg-red-50 border-red-200"; }
        else if (pValue > 0.75) { diag = "容易"; badgeColor = "text-green-600 bg-green-50 border-green-200"; }
        else { diag = "中等"; badgeColor = "text-amber-600 bg-amber-50 border-amber-200"; }
      }
      return {
        ...q,
        topicDesc: q.topicDesc || q.desc || "",
        attempts,
        totalScore,
        pValue,
        pct: pValue != null ? pValue * 100 : null,
        diag,
        badgeColor,
        counts
      };
    });
  }, [map, qList, attemptedStudents, examScores, selectedExam]);

  const sortedStats = useMemo(() => {
    const arr = qStats.slice();
    if (sortMode === "pAsc") arr.sort((a, b) => (a.pct ?? 999) - (b.pct ?? 999));
    else if (sortMode === "pDesc") arr.sort((a, b) => (b.pct ?? -1) - (a.pct ?? -1));
    else arr.sort((a, b) => String(a.id).localeCompare(String(b.id), undefined, { numeric: true }));
    return arr;
  }, [qStats, sortMode]);

  useEffect(() => {
    setAiSelected(qStats.filter(q => q.pct != null && q.pct < 60).map(q => q.id));
  }, [selectedExam, qStats.map(q => q.id + ":" + Math.round(q.pct || 0)).join("|")]);

  const classAvg = useMemo(() => {
    if (!attemptedStudents.length || !map) return null;
    let sumW = 0, n = 0;
    attemptedStudents.forEach(s => {
      const st = calcStudent(s.id);
      if (st) { sumW += st.weighted; n++; }
    });
    return n ? sumW / n : null;
  }, [attemptedStudents, examScores, selectedExam, map]);

  const buildPrompt = () => {
    const list = (aiSelected.length ? qStats.filter(q => aiSelected.includes(q.id)) : qStats.filter(q => q.pct != null && q.pct < 60));
    const weakQ = list.map(q => formatWeakItem(q, `全班得分率 ${q.pct == null ? "—" : Math.round(q.pct) + "%"}，難度體感：${q.diag}`)).join("\n") || "- （無）";
    const topicIds = list.map(q => q.topicId).filter(Boolean);
    const syllabus = getSyllabusTableText(topicIds);
    const tasks = [];
    if (aiExtra.practice) tasks.push(`A. 針對性練習：${aiMc} MC + ${aiLq} LQ，難度「${aiLevel}」。每題標明 topicId。`);
    if (aiExtra.review) tasks.push(`B. 約 15 分鐘試後檢討大綱（迷思、3 條 Concept Checking）。`);
    if (aiExtra.explainImg) tasks.push(`C. 解說圖描述。`);
    if (aiExtra.ppt) tasks.push(`D. PPT 大綱 8–12 頁。`);
    if (aiExtra.notes) tasks.push(`E. 溫習筆記。`);
    if (!tasks.length) tasks.push(`A. 練習 ${aiMc} MC + ${aiLq} LQ。`);
    return `【身份】你是香港 DSE 物理科老師。

【任務】全班剛完成考試「${map?.title || selectedExam}」（已入分 ${attemptedStudents.length} 人${classAvg != null ? `，加權平均約 ${classAvg.toFixed(1)}` : ""}）。

【弱項／選中題目】（含 topicId）
${weakQ}

【課程大綱參考】
${syllabus}

【產出要求】
${tasks.map((x,i)=>`${i+1}. ${x}`).join("\n")}

【其他】繁體中文；對應 topicId；直接給內容。`;
  };

  if (!examIds.length) {
    return <div className="p-8 text-slate-400">尚未有考試藍圖。請先到「考試內容設定」或匯入 examMaps。</div>;
  }
  if (!map) return <div className="p-8 text-slate-400">找不到考試資料</div>;

  const rec = selectedStudentId ? (examScores[selectedStudentId]?.[selectedExam] || {}) : {};
  const curStats = selectedStudentId ? calcStudent(selectedStudentId) : null;

  return (
    <div className="space-y-4">
      <div className="grid lg:grid-cols-5 gap-4">
        <div className="lg:col-span-2 bg-white rounded-2xl border p-4 space-y-3">
          <select className="w-full border rounded-lg px-2 py-2 text-sm font-bold" value={selectedExam}
            onChange={e => { setSelectedExam(e.target.value); setSelectedStudentId(""); }}>
            {examIds.map(id => <option key={id} value={id}>{id} — {examMaps[id].title || id}</option>)}
          </select>
          {loading && <div className="text-[11px] text-slate-400">載入此考試成績中…</div>}
          {!!loadInfo && <div className="text-[11px] text-slate-500">{loadInfo}</div>}
          <div className="max-h-[60vh] overflow-auto space-y-1">
            {activeStudents.map(s => {
              const st = calcStudent(s.id);
              return (
                <button key={s.id} onClick={() => setSelectedStudentId(s.id)}
                  className={`w-full text-left px-3 py-2 rounded-xl border text-sm flex justify-between ${selectedStudentId===s.id?"border-purple-400 bg-purple-50":"border-slate-100 hover:bg-slate-50"}`}>
                  <span><b>{s.class}-{s.num}</b> {s.name}</span>
                  {st && (
                    <span className="text-xs font-bold text-purple-700">
                      {st.total}/{st.max}
                      <span className="text-slate-400 font-normal ml-1">加權{st.weighted.toFixed(1)}</span>
                    </span>
                  )}
                </button>
              );
            })}
          </div>
        </div>
        <div className="lg:col-span-3 bg-white rounded-2xl border p-4">
          {!selectedStudentId ? (
            <p className="text-slate-400 p-8 text-center">選擇學生輸入考試成績</p>
          ) : (
            <div className="space-y-3">
              <div className="flex flex-wrap justify-between items-center gap-2">
                <div className="font-bold">{activeStudents.find(x=>x.id===selectedStudentId)?.name} · {selectedExam}</div>
                <div className="flex items-center gap-2">
                  {curStats && <span className="text-sm font-bold text-purple-700">加權 {curStats.weighted.toFixed(1)}（MC {curStats.mcScore}/{curStats.mcMax} · LQ {curStats.lqScore}/{curStats.lqMax}）</span>}
                  <span className="text-xs text-slate-400">{saveStatus==="saving"?"儲存中…":saveStatus==="saved"?"已存":""}</span>
                  <button className="text-xs font-bold text-rose-600" onClick={clearStudent}>清除此卷</button>
                </div>
              </div>
              <div className="space-y-2 max-h-[55vh] overflow-auto">
                {qList.map(q => {
                  const raw = rec[q.id];
                  const has = raw !== undefined && raw !== null && String(raw).trim() !== "";
                  let scoreColor = "border-slate-200 bg-white";
                  if (has) {
                    if (q.type === "MC") {
                      const ok = q.ans && q.ans.toString().split(",").map(a=>a.trim().toUpperCase()).includes(String(raw).trim().toUpperCase());
                      scoreColor = ok ? "border-emerald-400 bg-emerald-50 text-emerald-800" : "border-rose-400 bg-rose-50 text-rose-700";
                    } else {
                      const n = parseFloat(raw);
                      if (!isNaN(n) && n <= 0) scoreColor = "border-rose-400 bg-rose-50 text-rose-700";
                      else if (!isNaN(n) && n >= (q.max||0)) scoreColor = "border-emerald-400 bg-emerald-50 text-emerald-800";
                      else scoreColor = "border-amber-400 bg-amber-50 text-amber-800";
                    }
                  }
                  return (
                    <div key={q.id} className="border rounded-xl p-2 flex gap-2 items-center">
                      <div className="w-20 shrink-0">
                        <div className="text-xs font-bold mono">{q.id}</div>
                        <div className="text-[10px] text-slate-400">{q.type}</div>
                      </div>
                      <div className="flex-1 text-xs text-slate-600 truncate" title={q.topicDesc}>{q.topicId} {q.topicDesc}</div>
                      <div className="flex items-center gap-1">
                        {q.type === "MC" ? (
                          <input data-ex-qid={q.id} ref={el=>{if(el)inputRefs.current[q.id]=el;}}
                            className={`w-14 border-2 rounded px-1 py-1 text-center font-bold uppercase ${scoreColor}`}
                            maxLength={1} value={raw ?? ""}
                            onChange={e=>setQVal(q.id, e.target.value, q)}
                            onKeyDown={e=>{ if(e.key==="Enter"||e.key==="Tab"){ e.preventDefault(); focusNext(q.id);} }}
                          />
                        ) : (
                          <input data-ex-qid={q.id} ref={el=>{if(el)inputRefs.current[q.id]=el;}} type="number"
                            className={`w-16 border-2 rounded px-1 py-1 text-center font-bold ${scoreColor}`}
                            value={raw ?? ""}
                            onChange={e=>setQVal(q.id, e.target.value, q)}
                            onKeyDown={e=>{ if(e.key==="Enter"||e.key==="Tab"){ e.preventDefault(); focusNext(q.id);} }}
                          />
                        )}
                        {q.type !== "MC" && <span className="text-[11px] font-bold text-slate-400">/{q.max}</span>}
                        {q.type==="MC" && q.ans && <span className="text-[10px] text-slate-500 font-bold">{q.ans}</span>}
                      </div>
                    </div>
                  );
                })}
              </div>
            </div>
          )}
        </div>
      </div>

      {/* 考試弱點分析 */}
      <div className="bg-white rounded-2xl border p-5 space-y-5">
        <div className="flex flex-wrap justify-between gap-2 items-center">
          <div>
            <h3 className="font-bold text-lg">考試弱點分析 · {selectedExam} {map.title}</h3>
            <p className="text-xs text-slate-500">已入分 {attemptedStudents.length} 人{classAvg != null ? ` · 全班加權平均 ${classAvg.toFixed(1)}` : ""}</p>
          </div>
          <label className="text-sm font-bold text-slate-600 flex items-center gap-2">
            排序
            <select className="border rounded-lg px-2 py-1.5 text-sm" value={sortMode} onChange={e=>setSortMode(e.target.value)}>
              <option value="question">按題目</option>
              <option value="pAsc">得分率由低至高</option>
              <option value="pDesc">得分率由高至低</option>
            </select>
          </label>
        </div>

        {!attemptedStudents.length ? (
          <p className="text-slate-400 text-sm">尚無足夠成績作分析</p>
        ) : (
          <>
            <div className="grid md:grid-cols-3 gap-3">
              {[
                { title: "淺 (P ≥ 75%)", cls: "bg-emerald-50 border-emerald-200 text-emerald-800", filter: q => q.pct != null && q.pct >= 75 },
                { title: "中 (40% ≤ P < 75%)", cls: "bg-amber-50 border-amber-200 text-amber-900", filter: q => q.pct != null && q.pct >= 40 && q.pct < 75 },
                { title: "深 (P < 40%)", cls: "bg-rose-50 border-rose-200 text-rose-800", filter: q => q.pct != null && q.pct < 40 },
              ].map((card, i) => {
                const list = qStats.filter(card.filter);
                return (
                  <div key={i} className={`rounded-2xl border p-4 ${card.cls}`}>
                    <div className="font-bold text-sm">{card.title}</div>
                    <div className="text-3xl font-black my-2">{list.length} <span className="text-base">題</span></div>
                    <div className="text-xs font-semibold break-words">{list.map(q=>q.id).join(", ") || "—"}</div>
                  </div>
                );
              })}
            </div>

            <div className="overflow-auto max-h-96 border rounded-xl">
              <table className="min-w-full text-xs">
                <thead className="bg-purple-50 sticky top-0">
                  <tr>
                    <th className="px-2 py-2 text-left">選</th>
                    <th className="px-2 py-2 text-left">題號</th>
                    <th className="px-2 py-2 text-left">考核概念</th>
                    <th className="px-2 py-2 text-center">topicId</th>
                    <th className="px-2 py-2 text-center">作答</th>
                    <th className="px-2 py-2 text-center">得分率</th>
                    <th className="px-2 py-2 text-center">診斷</th>
                    <th className="px-2 py-2 text-left">MC 選項分佈</th>
                  </tr>
                </thead>
                <tbody>
                  {sortedStats.map(q => {
                    const pctCls = q.pct == null ? "text-slate-400" : q.pct < 40 ? "text-rose-600 font-bold" : q.pct < 75 ? "text-amber-600 font-bold" : "text-emerald-600 font-bold";
                    return (
                      <tr key={q.id} className="border-t">
                        <td className="px-2 py-1.5">
                          <input type="checkbox" checked={aiSelected.includes(q.id)}
                            onChange={() => setAiSelected(prev => prev.includes(q.id) ? prev.filter(x=>x!==q.id) : [...prev, q.id])} />
                        </td>
                        <td className="px-2 py-1.5 mono font-bold">{q.id}</td>
                        <td className="px-2 py-1.5 max-w-[200px] truncate" title={q.topicDesc}>{q.topicDesc}</td>
                        <td className="px-2 py-1.5 text-center mono text-[10px]">{q.topicId || "—"}</td>
                        <td className="px-2 py-1.5 text-center">{q.attempts}</td>
                        <td className={`px-2 py-1.5 text-center ${pctCls}`}>{q.pct == null ? "—" : q.pct.toFixed(1) + "%"}</td>
                        <td className="px-2 py-1.5 text-center">
                          <span className={`text-[10px] font-bold px-1.5 py-0.5 rounded border ${q.badgeColor}`}>{q.diag}</span>
                        </td>
                        <td className="px-2 py-1.5 min-w-[180px]">
                          {q.type !== "MC" ? <span className="text-slate-400">—</span> : (() => {
                            const total = Math.max(1, (q.counts.A||0)+(q.counts.B||0)+(q.counts.C||0)+(q.counts.D||0)+(q.counts.Other||0));
                            const ansSet = (q.ans||"").toString().toUpperCase().split(",").map(a=>a.trim()).filter(Boolean);
                            const colors = { A: "bg-sky-500", B: "bg-violet-500", C: "bg-amber-500", D: "bg-rose-400" };
                            return (
                              <div className="space-y-1 py-0.5">
                                {["A","B","C","D"].map(opt => {
                                  const n = q.counts[opt] || 0;
                                  const pct = Math.round((n / total) * 100);
                                  const isAns = ansSet.includes(opt);
                                  return (
                                    <div key={opt} className="flex items-center gap-1.5">
                                      <span className={`w-4 text-[11px] font-black ${isAns ? "text-emerald-600" : "text-slate-600"}`}>{opt}</span>
                                      <div className="flex-1 h-3 rounded-md bg-slate-100 overflow-hidden border border-slate-200">
                                        <div className={`h-full ${isAns ? "bg-emerald-500" : colors[opt]}`} style={{width: Math.max(pct, n>0?4:0)+"%"}} title={n+" 人"} />
                                      </div>
                                      <span className={`text-[11px] font-bold w-12 text-right tabular-nums ${isAns?"text-emerald-700":"text-slate-700"}`}>{n}<span className="text-slate-400 font-normal">({pct}%)</span></span>
                                    </div>
                                  );
                                })}
                                {ansSet.length > 0 && (
                                  <div className="text-[10px] text-emerald-700 font-bold">✓ 答案 {ansSet.join("/")}</div>
                                )}
                              </div>
                            );
                          })()}
                        </td>
                      </tr>
                    );
                  })}
                </tbody>
              </table>
            </div>

            <div className="rounded-2xl border-2 border-violet-300 bg-violet-50 p-5 space-y-4">
              <div className="font-black text-violet-900 text-lg">考試 AI Prompt</div>
              <div className="flex flex-wrap gap-2">
                <button className="px-3 py-1.5 rounded-lg bg-rose-100 text-rose-800 font-bold text-sm border"
                  onClick={() => setAiSelected(qStats.filter(q=>q.pct!=null&&q.pct<60).map(q=>q.id))}>全選弱項(&lt;60%)</button>
                <button className="px-3 py-1.5 rounded-lg bg-white border font-bold text-sm" onClick={() => setAiSelected(qStats.map(q=>q.id))}>全選</button>
                <button className="px-3 py-1.5 rounded-lg bg-white border font-bold text-sm" onClick={() => setAiSelected([])}>清空</button>
              </div>
              <div className="grid sm:grid-cols-3 gap-3">
                <label className="text-sm font-bold">難度
                  <select className="mt-1 w-full border-2 rounded-lg px-3 py-2" value={aiLevel} onChange={e=>setAiLevel(e.target.value)}>
                    <option value="淺">淺</option><option value="中">中</option><option value="深">深</option>
                  </select>
                </label>
                <label className="text-sm font-bold">MC
                  <input type="number" className="mt-1 w-full border-2 rounded-lg px-3 py-2" value={aiMc} onChange={e=>setAiMc(parseInt(e.target.value)||0)} />
                </label>
                <label className="text-sm font-bold">LQ
                  <input type="number" className="mt-1 w-full border-2 rounded-lg px-3 py-2" value={aiLq} onChange={e=>setAiLq(parseInt(e.target.value)||0)} />
                </label>
              </div>
              <div className="flex flex-wrap gap-3">
                {[
                  ["practice","弱項練習"],
                  ["review","試後檢討"],
                  ["explainImg","解說圖"],
                  ["ppt","PPT"],
                  ["notes","筆記"],
                ].map(([k,lab])=>(
                  <label key={k} className={`flex items-center gap-2 px-3 py-2 rounded-xl border-2 text-sm font-bold cursor-pointer ${aiExtra[k]?"border-violet-500 bg-white":"border-slate-200"}`}>
                    <input type="checkbox" checked={!!aiExtra[k]} onChange={e=>setAiExtra(x=>({...x,[k]:e.target.checked}))} /> {lab}
                  </label>
                ))}
              </div>
              <button className="bg-violet-600 text-white font-black px-6 py-3 rounded-xl"
                onClick={() => navigator.clipboard.writeText(buildPrompt()).then(()=>alert("已複製")).catch(()=>alert("失敗"))}>
                複製 AI Prompt（已選 {aiSelected.length} 題 · 含 Syllabus）
              </button>
            </div>
          </>
        )}
      </div>

      {/* 補考專區 */}
      <div className="bg-white rounded-2xl border p-5 space-y-4">
        <div className="flex flex-wrap justify-between gap-3 items-start">
          <div>
            <h3 className="font-bold text-lg text-purple-900">補考專區 · {selectedExam}</h3>
            <p className="text-xs text-slate-500">可手動加入任何學生，或一鍵加入建議名單。勾選難點 → 標完成；進度 100% 才算完成。</p>
          </div>
          <div className="flex flex-wrap gap-2 items-center">
            <select id="exam-makeup-add" className="border-2 rounded-lg px-2 py-2 text-sm font-semibold min-w-[160px]"
              defaultValue=""
              onChange={e => {
                const sid = e.target.value;
                e.target.value = "";
                if (!sid || makeup[sid]) return;
                const st = calcStudent(sid);
                const entry = { category: !st ? "ABSENT" : (st.weighted < 50 ? "FAIL" : "MANUAL"), remark: "", topics: {} };
                const rec = examScores[sid]?.[selectedExam] || {};
                const topicBag = {};
                qList.forEach(q => {
                  if (!q.topicId) return;
                  const raw = rec[q.id];
                  if (raw === undefined || raw === null || String(raw).trim() === "") return;
                  const sc = quizQuestionScore(q, raw);
                  if (sc == null) return;
                  if (!topicBag[q.topicId]) topicBag[q.topicId] = { score: 0, max: 0, desc: q.topicDesc || "" };
                  topicBag[q.topicId].score += sc;
                  topicBag[q.topicId].max += (q.max || 1);
                  topicBag[q.topicId].desc = q.topicDesc || topicBag[q.topicId].desc || "";
                });
                Object.entries(topicBag).forEach(([tid, v]) => {
                  const pct = v.max > 0 ? (v.score / v.max) * 100 : 0;
                  if (pct < 60) entry.topics[tid] = { done: false, label: v.desc || tid, pct: Math.round(pct) };
                });
                if (!Object.keys(entry.topics).length) {
                  qStats.filter(q => q.pct != null && q.pct < 50 && q.topicId).forEach(q => {
                    if (!entry.topics[q.topicId]) entry.topics[q.topicId] = { done: false, label: q.topicDesc || q.topicId, pct: Math.round(q.pct) };
                  });
                }
                const next = { ...makeup, [sid]: entry };
                persistExamMakeup(next);
                setMakeupFocus(sid);
              }}>
              <option value="">＋ 手動加入學生…</option>
              {activeStudents.filter(s => !makeup[s.id]).map(s => (
                <option key={s.id} value={s.id}>{s.class}-{s.num} {s.name}</option>
              ))}
            </select>
            <button className="text-sm font-black px-4 py-2.5 rounded-xl bg-amber-500 hover:bg-amber-600 text-white shadow border-2 border-amber-600"
              onClick={() => {
                const next = { ...makeup };
                activeStudents.forEach(s => {
                  const st = calcStudent(s.id);
                  if (!st) {
                    if (!next[s.id]) next[s.id] = { category: "ABSENT", remark: "", topics: {} };
                  } else if (st.weighted < 50) {
                    if (!next[s.id]) next[s.id] = { category: "FAIL", remark: "", topics: {} };
                  }
                });
                Object.keys(next).forEach(sid => {
                  if (!next[sid].topics) next[sid].topics = {};
                  const rec = examScores[sid]?.[selectedExam] || {};
                  const topicBag = {};
                  qList.forEach(q => {
                    const raw = rec[q.id];
                    if (!q.topicId) return;
                    if (raw === undefined || raw === null || String(raw).trim() === "") return;
                    const sc = quizQuestionScore(q, raw);
                    if (sc == null) return;
                    if (!topicBag[q.topicId]) topicBag[q.topicId] = { score: 0, max: 0, desc: q.topicDesc || "" };
                    topicBag[q.topicId].score += sc;
                    topicBag[q.topicId].max += (q.max || 1);
                    topicBag[q.topicId].desc = q.topicDesc || topicBag[q.topicId].desc || "";
                  });
                  Object.entries(topicBag).forEach(([tid, v]) => {
                    const pct = v.max > 0 ? (v.score / v.max) * 100 : 0;
                    if (pct < 60 && !next[sid].topics[tid]) {
                      next[sid].topics[tid] = { done: false, label: v.desc || tid, pct: Math.round(pct) };
                    }
                  });
                  if (next[sid].category === "ABSENT" && !Object.keys(next[sid].topics).length) {
                    qStats.filter(q => q.pct != null && q.pct < 50 && q.topicId).forEach(q => {
                      if (!next[sid].topics[q.topicId]) {
                        next[sid].topics[q.topicId] = { done: false, label: q.topicDesc || q.topicId, pct: Math.round(q.pct) };
                      }
                    });
                  }
                });
                persistExamMakeup(next);
              }}>
              ＋ 加入建議名單（無測 + 不合格&lt;50%）
            </button>
          </div>
        </div>

        <div className="grid lg:grid-cols-5 gap-4">
          <div className="lg:col-span-2 border rounded-xl p-3 space-y-2 max-h-[420px] overflow-auto">
            <div className="text-sm font-bold text-slate-600">補考名單</div>
            {Object.keys(makeup).length === 0 && <p className="text-xs text-slate-400">尚未加入學生</p>}
            {Object.keys(makeup).map(sid => {
              const s = activeStudents.find(x => x.id === sid);
              const m = makeup[sid] || {};
              const topics = m.topics || {};
              const ids = Object.keys(topics);
              const doneN = ids.filter(id => topics[id]?.done).length;
              const pctProg = ids.length ? Math.round((doneN / ids.length) * 100) : 0;
              const complete = ids.length > 0 && doneN === ids.length;
              return (
                <button key={sid} onClick={() => setMakeupFocus(sid)}
                  className={`w-full text-left rounded-xl border p-3 ${makeupFocus===sid?"border-purple-400 bg-purple-50":"border-slate-100 hover:bg-slate-50"}`}>
                  <div className="flex justify-between items-center gap-2">
                    <span className="font-bold text-sm">{s ? `${s.class}-${s.num} ${s.name}` : sid}</span>
                    <span className={`text-[10px] font-black px-1.5 py-0.5 rounded ${complete?"bg-emerald-100 text-emerald-700":"bg-amber-100 text-amber-800"}`}>
                      {complete ? "已完成" : "進行中"}
                    </span>
                  </div>
                  <div className="mt-1 flex items-center gap-2">
                    <div className="flex-1 h-2 rounded-full bg-slate-100 overflow-hidden">
                      <div className={`h-full ${complete?"bg-emerald-500":"bg-purple-500"}`} style={{width: pctProg+"%"}} />
                    </div>
                    <span className="text-[11px] font-bold text-slate-600">{doneN}/{ids.length} ({pctProg}%)</span>
                  </div>
                  <div className="text-[10px] text-slate-400 mt-0.5">{m.category==="FAIL"?"不合格":"無測／缺席"}</div>
                </button>
              );
            })}
          </div>

          <div className="lg:col-span-3 border rounded-xl p-4 space-y-3">
            {!makeupFocus || !makeup[makeupFocus] ? (
              <p className="text-slate-400 text-sm p-6 text-center">在左側選擇一位補考學生</p>
            ) : (() => {
              const sid = makeupFocus;
              const s = activeStudents.find(x => x.id === sid);
              const m = makeup[sid] || {};
              const topics = m.topics || {};
              const topicIds = Object.keys(topics);
              const doneN = topicIds.filter(id => topics[id]?.done).length;
              const pctProg = topicIds.length ? Math.round((doneN / topicIds.length) * 100) : 0;
              const st = calcStudent(sid);

              const toggleTopicDone = (tid) => {
                const next = {
                  ...makeup,
                  [sid]: {
                    ...m,
                    topics: {
                      ...topics,
                      [tid]: { ...topics[tid], done: !topics[tid]?.done }
                    }
                  }
                };
                // 100% → status DONE
                const t2 = next[sid].topics;
                const ids = Object.keys(t2);
                const allDone = ids.length > 0 && ids.every(id => t2[id].done);
                next[sid].status = allDone ? "DONE" : "PENDING";
                persistExamMakeup(next);
              };

              const toggleTopicInclude = (tid, label, pct) => {
                const nextTopics = { ...topics };
                if (nextTopics[tid]) delete nextTopics[tid];
                else nextTopics[tid] = { done: false, label: label || tid, pct: pct ?? null };
                const next = { ...makeup, [sid]: { ...m, topics: nextTopics } };
                const ids = Object.keys(nextTopics);
                const allDone = ids.length > 0 && ids.every(id => nextTopics[id].done);
                next[sid].status = allDone ? "DONE" : "PENDING";
                persistExamMakeup(next);
              };

              // 可選難點池：全班弱 topic + 個人失分 topic
              const pool = {};
              qStats.forEach(q => {
                if (!q.topicId) return;
                if (!pool[q.topicId]) pool[q.topicId] = { topicId: q.topicId, label: q.topicDesc || q.topicId, pct: q.pct };
                else if (q.pct != null && (pool[q.topicId].pct == null || q.pct < pool[q.topicId].pct)) {
                  pool[q.topicId].pct = q.pct;
                  pool[q.topicId].label = q.topicDesc || pool[q.topicId].label;
                }
              });

              const buildMakeupPrompt = () => {
                const selected = topicIds.filter(id => topics[id]);
                const lines = selected.map(id => {
                  const info = SYLLABUS_TOPICS[id];
                  const name = typeof info === "object" && info ? (info.topic || info.name || "") : (info || "");
                  const tt = topics[id];
                  return `- topicId: ${id}｜${name || tt.label || ""}｜掌握約 ${tt.pct != null ? tt.pct + "%" : "—"}｜${tt.done ? "已完成" : "待補"}`;
                }).join("\n") || "- （請先勾選難點）";
                const syllabus = getSyllabusTableText(selected);
                return `【身份】你是香港 DSE 物理科老師。

【任務】為補考學生 ${s ? `${s.class}-${s.num} ${s.name}` : sid} 生成【互動式小測驗】，必須在 AI **Canvas** 模式中逐題作答、即時回饋。

【考試】${map?.title || selectedExam}
【學生成績】${st ? `卷面 ${st.total}/${st.max}，加權 ${st.weighted.toFixed(1)}` : "無測／缺席"}
【備註】${m.remark || "無"}

【要補的難點】（含 topicId）
${lines}

【課程大綱參考】
${syllabus}

【基本設定】
- 繁體中文；難度：${mkLevel}
- MC：${mkMc} 題；LQ：${mkLq} 題
- ★ Canvas 互動式：先出題，待學生回答再評；勿一次公開全部答案

【要求】每題標明 topicId；針對上列難點；開頭一句鼓勵。`;
              };

              return (
                <div className="space-y-3">
                  <div className="flex flex-wrap justify-between gap-2 items-start">
                    <div>
                      <div className="font-bold text-lg">{s ? `${s.class} ${s.name}` : sid}</div>
                      <div className="text-xs text-slate-500">
                        {st ? `試卷得分 ${st.total}/${st.max}` : "無成績"} · 補底進度 {doneN}/{topicIds.length} ({pctProg}%)
                      </div>
                      <div className="mt-1 w-48 h-2 rounded-full bg-slate-100 overflow-hidden">
                        <div className="h-full bg-purple-500" style={{width: pctProg+"%"}} />
                      </div>
                    </div>
                    <button className="text-xs font-bold text-rose-600" onClick={() => {
                      const next = { ...makeup }; delete next[sid];
                      persistExamMakeup(next);
                      setMakeupFocus("");
                    }}>移出名單</button>
                  </div>

                  <label className="text-xs font-bold text-slate-500 block">備註
                    <input className="mt-1 w-full border rounded-lg px-2 py-1.5 text-sm" placeholder="例：只完成熱傳導，放學再來"
                      value={m.remark || ""}
                      onChange={e => {
                        const next = { ...makeup, [sid]: { ...m, remark: e.target.value } };
                        setMakeup(next);
                        if (window.__exMkTimer) clearTimeout(window.__exMkTimer);
                        window.__exMkTimer = setTimeout(() => persistExamMakeup(next), 500);
                      }} />
                  </label>

                  <div>
                    <div className="text-sm font-bold text-slate-700 mb-2">補底課題（勾選納入／再點「完成」標記）</div>
                    <div className="flex flex-wrap gap-2">
                      {Object.values(pool).sort((a,b)=>(a.pct??999)-(b.pct??999)).map(tp => {
                        const on = !!topics[tp.topicId];
                        const done = on && topics[tp.topicId].done;
                        return (
                          <div key={tp.topicId}
                            className={`rounded-xl border-2 px-2 py-1.5 text-xs font-bold flex items-center gap-1.5 ${done?"border-emerald-400 bg-emerald-50 text-emerald-800":on?"border-purple-400 bg-purple-50 text-purple-900":"border-slate-200 bg-white text-slate-600"}`}>
                            <input type="checkbox" checked={on} onChange={() => toggleTopicInclude(tp.topicId, tp.label, tp.pct != null ? Math.round(tp.pct) : null)} />
                            <span className="mono">{tp.topicId}</span>
                            <span className="truncate max-w-[100px]">{tp.label}</span>
                            <span className={`px-1 rounded ${tp.pct!=null&&tp.pct<40?"bg-rose-100 text-rose-700":"bg-slate-100"}`}>{tp.pct!=null?Math.round(tp.pct)+"%":"—"}</span>
                            {on && (
                              <button type="button" className={`ml-1 px-1.5 py-0.5 rounded text-[10px] ${done?"bg-emerald-600 text-white":"bg-slate-200"}`}
                                onClick={() => toggleTopicDone(tp.topicId)}>
                                {done ? "✓已完成" : "標完成"}
                              </button>
                            )}
                          </div>
                        );
                      })}
                    </div>
                    {pctProg < 100 && topicIds.length > 0 && (
                      <p className="text-[11px] text-amber-700 mt-2 font-semibold">需完成全部已選課題（{doneN}/{topicIds.length}）才算補底 100%。</p>
                    )}
                    {pctProg === 100 && topicIds.length > 0 && (
                      <p className="text-[11px] text-emerald-700 mt-2 font-bold">已達補底 100%，可標記為完成。</p>
                    )}
                  </div>

                  <div className="rounded-xl border border-violet-200 bg-violet-50 p-3 space-y-2">
                    <div className="font-bold text-violet-900 text-sm">個人專屬 Prompt 出題（Canvas 互動）</div>
                    <div className="grid grid-cols-3 gap-2">
                      <label className="text-xs font-bold">難度
                        <select className="mt-0.5 w-full border rounded px-1 py-1" value={mkLevel} onChange={e=>setMkLevel(e.target.value)}>
                          <option value="淺">淺</option><option value="中">中</option><option value="深">深</option>
                        </select>
                      </label>
                      <label className="text-xs font-bold">MC
                        <input type="number" className="mt-0.5 w-full border rounded px-1 py-1" value={mkMc} onChange={e=>setMkMc(parseInt(e.target.value)||0)} />
                      </label>
                      <label className="text-xs font-bold">LQ
                        <input type="number" className="mt-0.5 w-full border rounded px-1 py-1" value={mkLq} onChange={e=>setMkLq(parseInt(e.target.value)||0)} />
                      </label>
                    </div>
                    <button className="bg-violet-600 text-white font-bold text-sm px-4 py-2 rounded-lg"
                      onClick={() => navigator.clipboard.writeText(buildMakeupPrompt()).then(()=>alert("已複製補考 Prompt")).catch(()=>alert("失敗"))}>
                      複製此生補考 Prompt
                    </button>
                  </div>
                </div>
              );
            })()}
          </div>
        </div>
        {makeupSaving && <div className="text-[11px] text-slate-400">補考記錄儲存中…</div>}
      </div>
    </div>
  );
}

function ExamSettingsView({ students, examMaps, setExamMaps, currentCohort }) {
  const cohorts = useMemo(() => Array.from(new Set(students.map(s => s.cohort).filter(Boolean))).sort(), [students]);
  const [selectedCohort, setSelectedCohort] = useState(currentCohort && currentCohort !== "所有學生" ? currentCohort : (cohorts[0] || ""));
  const [examId, setExamId] = useState("");
  const [examTitle, setExamTitle] = useState("");
  const [pasteData, setPasteData] = useState("");
  const [editingOriginalId, setEditingOriginalId] = useState(null);
  const [assignCohort, setAssignCohort] = useState("");
  const [busy, setBusy] = useState(false);

  useEffect(() => {
    if (currentCohort && currentCohort !== "所有學生") setSelectedCohort(currentCohort);
  }, [currentCohort]);

  const listIds = useMemo(() => Object.keys(examMaps || {}).sort(), [examMaps]);

  const parseLines = (text) => {
    return text.trim().split("\n").map(line => {
      const clean = line.trim(); if (!clean) return null;
      let cols = clean.split("\t").map(c => c.trim());
      // 支援 9 欄整表：考試編號 標題 題號 題型 滿分 難度 topicId 描述 答案
      if (cols.length >= 8 && cols[0] && cols[2] && (cols[1] || "").length > 0) {
        // 可能是整表列
        const maybeType = (cols[3] || "").toUpperCase();
        if (maybeType === "MC" || maybeType === "LQ") {
          return {
            examIdFromRow: cols[0],
            titleFromRow: cols[1],
            id: cols[2],
            type: maybeType,
            max: parseFloat(cols[4]) || 1,
            level: (cols[5] || "中").trim(),
            topicId: (cols[6] || "").trim(),
            topicDesc: (cols[7] || "").trim(),
            ans: (cols[8] || "").trim().toUpperCase()
          };
        }
      }
      if (cols.length < 6) {
        const multi = clean.split(/\s{2,}/).map(c => c.trim()).filter(Boolean);
        if (multi.length >= 6) cols = multi;
      }
      let maxScore = parseFloat(cols[2]); if (isNaN(maxScore) || maxScore <= 0) maxScore = 1;
      const type = (cols[1] || "MC").toUpperCase();
      return {
        id: (cols[0] || "").trim(),
        type,
        max: maxScore,
        level: (cols[3] || "中").trim(),
        topicId: (cols[4] || "").trim(),
        topicDesc: (cols[5] || "").trim(),
        ans: (cols[6] || "").trim().toUpperCase()
      };
    }).filter(q => q && q.id && !String(q.id).includes("題目") && !String(q.id).includes("編號") && !String(q.id).includes("考試"));
  };

  const loadEdit = (id) => {
    const m = examMaps[id];
    if (!m) return;
    setEditingOriginalId(id);
    setExamId(id);
    setExamTitle(m.title || "");
    setAssignCohort(m.cohort || "");
    let text = "";
    (m.questions || []).forEach(q => {
      text += `${q.id}\t${q.type}\t${q.max}\t${q.level || "中"}\t${q.topicId || ""}\t${q.topicDesc || ""}\t${q.ans || ""}\n`;
    });
    setPasteData(text);
  };

  const handleSave = async () => {
    if (!examId.trim() || !examTitle.trim()) return alert("請填寫考試編號與標題");
    const parsed = parseLines(pasteData);
    if (!parsed.length) return alert("無法解析題目");
    // 若貼上含考試編號的 9 欄，只取題目欄
    const questions = parsed.map(q => ({
      id: q.id,
      type: q.type,
      max: q.max,
      level: q.level,
      topicId: q.topicId,
      topicDesc: q.topicDesc,
      ans: q.ans || ""
    }));
    let cohortVal = assignCohort;
    if (cohortVal === "所有學生") cohortVal = "";
    setBusy(true);
    try {
      const newId = examId.trim();
      const oldId = editingOriginalId;
      const data = { title: examTitle.trim(), questions, cohort: cohortVal || "" };
      await saveExamMap(newId, data);
      const next = { ...examMaps, [newId]: { ...data, _id: newId } };
      if (oldId && oldId !== newId) {
        await deleteExamMap(oldId);
        delete next[oldId];
        // 遷移成績 exams 子集合
        const stuSnap = await db.collection("students").get();
        for (const d of stuSnap.docs) {
          const ref = db.collection("scores").doc(d.id).collection("exams").doc(oldId);
          const snap = await ref.get();
          if (snap.exists) {
            await db.collection("scores").doc(d.id).collection("exams").doc(newId).set(snap.data(), { merge: true });
            await ref.delete();
          }
        }
      }
      setExamMaps(next);
      setEditingOriginalId(newId);
      alert("已儲存考試藍圖" + (data.cohort ? `（群組：${data.cohort}）` : "（所有群組通用）"));
    } catch (e) { alert(e.message); }
    setBusy(false);
  };

  const handleDelete = async (id) => {
    if (!confirm(`確定刪除考試藍圖「${id}」？`)) return;
    setBusy(true);
    try {
      await deleteExamMap(id);
      const next = { ...examMaps };
      delete next[id];
      setExamMaps(next);
      if (editingOriginalId === id) {
        setEditingOriginalId(null); setExamId(""); setExamTitle(""); setPasteData(""); setAssignCohort("");
      }
    } catch (e) { alert(e.message); }
    setBusy(false);
  };

  const saveCohortOnly = async (id, cohort) => {
    const m = examMaps[id];
    if (!m) return;
    const c = cohort === "所有學生" ? "" : cohort;
    try {
      await saveExamMap(id, { ...m, cohort: c });
      setExamMaps(prev => ({ ...prev, [id]: { ...m, cohort: c } }));
    } catch (e) { alert(e.message); }
  };

  const buildExamCsvPrompt = () => {
    const syllabus = getSyllabusTableText();
    return `【身份】你是香港 DSE 物理科老師／出題助手。

【任務】我會上傳一份考試卷（PDF／Word／圖片）。請為每一小題產出 Tab 分隔列。

【課程大綱參考】（topicId 必須從下列課題編號選用）
${syllabus}

【輸出欄位】
考試編號 [Tab] 考試標題 [Tab] 題目ID [Tab] 題型 [Tab] 滿分 [Tab] 難度 [Tab] 課題編號 [Tab] 題目描述 [Tab] 正確答案

【規則】
1. 題號：MC1、MC2…／LQ1a、LQ1bi…
2. 題型：MC 或 LQ；難度：淺／中／深
3. topicId 必須用上方大綱編號；topicDesc 20–30 字
4. MC 答案 A/B/C/D；LQ 答案留空
5. 只輸出資料行（可含表頭），不要 Markdown`;
  };

  return (
    <div className="space-y-4">
      <div className="grid lg:grid-cols-5 gap-4">
        <div className="lg:col-span-2 bg-white rounded-2xl border p-4 space-y-3">
          <h2 className="font-bold text-lg text-purple-800">考試列表</h2>
          <p className="text-sm text-slate-600">無群組 = 所有群組可見。可為舊考試補上群組。</p>
          <div className="max-h-[65vh] overflow-auto space-y-2">
            {listIds.map(id => {
              const m = examMaps[id];
              return (
                <div key={id} className={`border rounded-xl p-3 ${editingOriginalId===id?"border-purple-400 bg-purple-50":"border-slate-200"}`}>
                  <button className="w-full text-left" onClick={() => loadEdit(id)}>
                    <div className="font-bold text-base mono text-purple-700">{id}</div>
                    <div className="text-sm font-semibold text-slate-800 truncate">{m.title}</div>
                    <div className="text-sm text-slate-500 mt-0.5">{(m.questions||[]).length} 題 · {m.cohort ? `群組 ${m.cohort}` : "所有群組通用"}</div>
                  </button>
                  <div className="mt-2 flex gap-2 items-center">
                    <select className="text-sm border rounded-lg flex-1 py-1.5 px-2 font-semibold" value={m.cohort || "所有學生"}
                      onChange={e => saveCohortOnly(id, e.target.value)}>
                      <option value="所有學生">所有群組</option>
                      {cohorts.map(c => <option key={c} value={c}>{c}</option>)}
                    </select>
                    <button className="text-sm text-rose-600 font-bold px-2" onClick={() => handleDelete(id)}>刪除</button>
                  </div>
                </div>
              );
            })}
            {!listIds.length && <p className="text-slate-400 text-sm">尚無考試，請右側新增或匯入 Sheet（examMaps）。</p>}
          </div>
        </div>
        <div className="lg:col-span-3 bg-white rounded-2xl border p-5 space-y-4">
          <h2 className="font-bold text-lg">{editingOriginalId ? `編輯：${editingOriginalId}` : "新增考試"}</h2>
          <div className="grid sm:grid-cols-2 gap-3">
            <label className="text-sm font-bold text-slate-600">考試編號
              <input className="mt-1 w-full border-2 rounded-lg px-3 py-2 text-sm font-bold" value={examId} onChange={e=>setExamId(e.target.value)} placeholder="如 MOCK2025" />
            </label>
            <label className="text-sm font-bold text-slate-600">標題
              <input className="mt-1 w-full border-2 rounded-lg px-3 py-2 text-sm" value={examTitle} onChange={e=>setExamTitle(e.target.value)} />
            </label>
            <label className="text-sm font-bold text-slate-600">所屬群組
              <select className="mt-1 w-full border-2 rounded-lg px-3 py-2 text-sm" value={assignCohort || "所有學生"} onChange={e=>setAssignCohort(e.target.value === "所有學生" ? "" : e.target.value)}>
                <option value="所有學生">所有群組通用</option>
                {cohorts.map(c => <option key={c} value={c}>{c}</option>)}
              </select>
            </label>
            <div className="text-sm text-slate-500 flex items-end pb-2">新建建議選「{selectedCohort || "—"}」</div>
          </div>
          <label className="text-sm font-bold text-slate-600 block">題目（Tab：題號 題型 滿分 難度 topicId 描述 [答案]）
            <textarea className="mt-1 w-full border-2 rounded-xl p-3 text-sm mono h-52" value={pasteData} onChange={e=>setPasteData(e.target.value)}
              placeholder={"MC1\tMC\t1\t中\t2.6.1\t計算功\tA\nLQ1a\tLQ\t2\t淺\t2.6.2\t計算勢能\t"} />
          </label>
          <div className="flex flex-wrap gap-2">
            <button disabled={busy} className="bg-purple-600 text-white font-bold px-5 py-2.5 rounded-xl text-sm disabled:opacity-50" onClick={handleSave}>
              {busy ? "儲存中…" : "儲存到 Firebase"}
            </button>
            <button className="border-2 font-bold px-5 py-2.5 rounded-xl text-sm" onClick={() => {
              setEditingOriginalId(null); setExamId(""); setExamTitle(""); setPasteData("");
              setAssignCohort(selectedCohort || "");
            }}>清空／新增</button>
          </div>
        </div>
      </div>
      <div className="rounded-2xl border-2 border-violet-300 bg-violet-50 p-5 space-y-3">
        <div className="font-black text-violet-900 text-lg">AI Prompt · 生成考試藍圖表格</div>
        <p className="text-sm text-violet-800">上傳試卷後生成含 <b>topicId</b> 的 Tab 表格（已附課程大綱）。</p>
        <button className="bg-violet-600 hover:bg-violet-700 text-white font-black px-6 py-3 rounded-xl text-base"
          onClick={() => navigator.clipboard.writeText(buildExamCsvPrompt()).then(()=>alert("已複製")).catch(()=>alert("失敗"))}>
          複製 AI Prompt（含 Syllabus / Topic ID）
        </button>
      </div>
    </div>
  );
}

function App() {
  const [view, setView] = useState("import");
  const [students, setStudents] = useState([]);
  const [homeworkMaps, setHomeworkMaps] = useState({});
  const [homeworkScores, setHomeworkScores] = useState({});
  const [quizMaps, setQuizMaps] = useState({});
  const [quizScores, setQuizScores] = useState({});
  const [examMaps, setExamMaps] = useState({});
  const [examScores, setExamScores] = useState({});
  const [loading, setLoading] = useState(true);
  const [cohort, setCohort] = useState("所有學生");

  const reload = useCallback(async () => {
    setLoading(true);
    try {
      const stu = await loadAllStudents();
      setStudents(stu);
      const maps = await loadHomeworkMaps();
      setHomeworkMaps(maps);
      const qmaps = await loadQuizMaps();
      setQuizMaps(qmaps);
      const emaps = await loadExamMaps();
      setExamMaps(emaps);
      await loadSyllabus();
      setHomeworkScores({});
      setQuizScores({});
      setExamScores({});
    } catch(e) { alert("載入失敗："+e.message); }
    setLoading(false);
  }, []);

  useEffect(()=>{ reload(); }, [reload]);

  const cohorts = useMemo(() => ["所有學生", ...Array.from(new Set(students.map(s=>s.cohort).filter(Boolean))).sort()], [students]);
  const activeStudents = useMemo(() => cohort==="所有學生" ? students : students.filter(s=>s.cohort===cohort), [students, cohort]);

  return (
    <div className="flex min-h-screen">
      <Sidebar view={view} setView={setView} />
      <main className="flex-1 p-6 overflow-auto">
        <div className="flex flex-wrap gap-3 items-center mb-4">
          <label className="text-sm font-bold text-slate-600">群組</label>
          <select className="border rounded-lg px-3 py-1.5 text-sm font-semibold" value={cohort} onChange={e=>setCohort(e.target.value)}>
            {cohorts.map(c=><option key={c} value={c}>{c}</option>)}
          </select>
          <button className="text-sm text-indigo-600 font-bold" onClick={reload}>重新載入雲端</button>
          {loading && <span className="text-xs text-slate-400">載入中…</span>}
        </div>
        {view==="import" && <ImportView onReload={reload} />}
        {view==="idMap" && <IdMapView students={students} onReload={reload} />}
        {view==="pins" && <PinsView students={students} onReload={reload} />}
        {view==="hwSettings" && <HwSettingsView students={students} homeworkMaps={homeworkMaps} setHomeworkMaps={setHomeworkMaps} currentCohort={cohort==="所有學生"?(cohorts[1]||""):cohort} />}
        {view==="hwGrade" && <HwGradeView activeStudents={activeStudents} homeworkMaps={homeworkMaps} homeworkScores={homeworkScores} setHomeworkScores={setHomeworkScores} currentCohort={cohort==="所有學生"?"":cohort} />}
        {view==="hwSummary" && <HwSummaryView activeStudents={activeStudents} homeworkMaps={homeworkMaps} homeworkScores={homeworkScores} setHomeworkScores={setHomeworkScores} currentCohort={cohort==="所有學生"?"":cohort} />}
        {view==="hwChase" && <HwChaseView activeStudents={activeStudents} homeworkMaps={homeworkMaps} homeworkScores={homeworkScores} setHomeworkScores={setHomeworkScores} currentCohort={cohort==="所有學生"?"":cohort} />}
        {view==="quizInput" && <QuizInputAnalysisView activeStudents={activeStudents} quizMaps={quizMaps} quizScores={quizScores} setQuizScores={setQuizScores} currentCohort={cohort} />}
        {view==="quizStudent" && <QuizStudentAnalysisView activeStudents={activeStudents} quizMaps={quizMaps} currentCohort={cohort} />}
        {view==="quizSummary" && <QuizSummaryView activeStudents={activeStudents} quizMaps={quizMaps} currentCohort={cohort} />}
        {view==="quizSettings" && <QuizSettingsView students={students} quizMaps={quizMaps} setQuizMaps={setQuizMaps} currentCohort={cohort} />}
        {view==="examInput" && <ExamInputAnalysisView activeStudents={activeStudents} examMaps={examMaps} examScores={examScores} setExamScores={setExamScores} currentCohort={cohort} />}
        {view==="examSettings" && <ExamSettingsView students={students} examMaps={examMaps} setExamMaps={setExamMaps} currentCohort={cohort} />}
      </main>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
