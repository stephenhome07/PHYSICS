const STATUS_META = {
  MISSING: { label: "未交", cls: "bg-slate-100 text-slate-600 border-slate-200" },
  PENDING: { label: "欠改正", cls: "bg-rose-50 text-rose-700 border-rose-200" },

function randomPin() {
  return String(Math.floor(1000 + Math.random() * 9000));
}

// ---------- Firestore helpers ----------
async function loadAllStudents() {
  const snap = await db.collection("students").get();
  const list = [];
  snap.forEach(d => list.push({ ...d.data(), id: d.id }));
  list.sort((a,b) => String(a.class||"").localeCompare(String(b.class||"")) || (Number(a.num)||0)-(Number(b.num)||0));
  return list;
}

async function loadHomeworkMaps() {
  const snap = await db.collection("homeworkMaps").get();
  const maps = {};
  snap.forEach(d => { maps[d.id] = { ...d.data(), _id: d.id }; });
  return maps;
}

async function loadHomeworkScores(studentIds) {
  const out = {};
  // sequential batches to avoid flooding
  for (const sid of studentIds) {
    out[sid] = {};
    try {
      const snap = await db.collection("scores").doc(sid).collection("homeworks").get();
      snap.forEach(d => { out[sid][d.id] = d.data(); });
    } catch(e) { console.warn(sid, e); }
  }
  return out;
}

async function saveHomeworkMap(hwId, data) {
  await db.collection("homeworkMaps").doc(String(hwId)).set({ ...data, updatedAt: new Date().toISOString() }, { merge: true });
}

async function deleteHomeworkMap(hwId) {
  await db.collection("homeworkMaps").doc(String(hwId)).delete();
}

async function saveHomeworkScore(studentId, hwId, record) {
  await db.collection("scores").doc(studentId).collection("homeworks").doc(String(hwId)).set({
    ...record,
    updatedAt: new Date().toISOString()
  }, { merge: true });
}

async function deleteHomeworkScore(studentId, hwId) {
  await db.collection("scores").doc(studentId).collection("homeworks").doc(String(hwId)).delete();
}

async function migrateStudentId(oldId, newId, studentPatch) {
  const oldRef = db.collection("students").doc(oldId);
  const newRef = db.collection("students").doc(newId);
  const oldSnap = await oldRef.get();
  if (!oldSnap.exists) throw new Error("找不到舊學生 " + oldId);
  const data = { ...oldSnap.data(), ...studentPatch, id: newId, sid: newId };
  await newRef.set(data, { merge: true });
  // move score subcollections
  for (const sub of ["homeworks", "quizzes", "exams", "pastpapers"]) {
    const snap = await db.collection("scores").doc(oldId).collection(sub).get();
    for (const doc of snap.docs) {
      await db.collection("scores").doc(newId).collection(sub).doc(doc.id).set(doc.data(), { merge: true });
      await doc.ref.delete();
    }
  }
  await oldRef.delete();
}

// ---------- Import + stats ----------
function ImportView({ onReload }) {
  const [json, setJson] = useState("");
  const [url, setUrl] = useState("");
  const [log, setLog] = useState("");
  const [stats, setStats] = useState(null);

  useEffect(() => {
    (async () => {
      try {
        const stu = await db.collection("students").get();
        const hw = await db.collection("homeworkMaps").get();
        const mig = await db.collection("meta").doc("migration").get();
        setStats({ students: stu.size, hw: hw.size, last: mig.exists ? mig.data().lastImportAt : null });
      } catch(e) { setStats({ error: e.message }); }
    })();
  }, []);

  const importPayload = async (payload) => {
    const logm = (m) => setLog(p => p + m + "\n");
    setLog("");
    let batch = db.batch(), ops = 0;
    const commit = async () => { if (!ops) return; await batch.commit(); batch = db.batch(); ops = 0; };
    const students = Array.isArray(payload.students) ? payload.students : [];
    logm(`學生 ${students.length}…`);
    for (const s of students) {
      if (!s?.id) continue;
      const id = String(s.id);
      batch.set(db.collection("students").doc(id), {
        id, sid: s.sid||id, class: s.class||"", num: s.num??"", name: s.name||"",
        cohort: s.cohort||"", pin: s.pin||randomPin(), active: s.active!==false,
        updatedAt: new Date().toISOString()
      }, { merge: true });
      ops++; if (ops>=400) await commit();
    }
    await commit();
    logm("✓ 學生");

    const writeMaps = async (col, obj) => {
      const data = obj||{};
      logm(`${col} ${Object.keys(data).length}…`);
      for (const k of Object.keys(data)) {
        batch.set(db.collection(col).doc(String(k)), { ...data[k], _id:k, updatedAt: new Date().toISOString() }, { merge:true });
        ops++; if (ops>=400) await commit();
      }
      await commit();
      logm("✓ "+col);
    };
    await writeMaps("homeworkMaps", payload.homeworkMaps);
    await writeMaps("quizMaps", payload.quizMaps);
    await writeMaps("examMaps", payload.examMaps);
    await writeMaps("pastpaperMaps", payload.pastpaperMaps);
    if (payload.syllabus) await db.collection("syllabus").doc("all").set({ data: payload.syllabus, updatedAt: new Date().toISOString() }, { merge:true });

    const writeScores = async (tree, sub) => {
      const root = tree||{};
      logm(`${sub}…`);
      for (const sid of Object.keys(root)) {
        for (const pid of Object.keys(root[sid]||{})) {
          const val = root[sid][pid];
          const doc = (val && typeof val==="object" && !Array.isArray(val)) ? { ...val } : { value: val };
          batch.set(db.collection("scores").doc(sid).collection(sub).doc(String(pid)), { ...doc, updatedAt: new Date().toISOString() }, { merge:true });
          ops++; if (ops>=400) await commit();
        }
      }
      await commit();
      logm("✓ "+sub);
    };
    await writeScores(payload.homeworkScores, "homeworks");
    await writeScores(payload.scores, "quizzes");
    await writeScores(payload.examScores, "exams");
    await writeScores(payload.pastpaperScores, "pastpapers");
    await db.collection("meta").doc("migration").set({ lastImportAt: new Date().toISOString(), source: "sheet-json" }, { merge:true });
    logm("✅ 完成");
    if (onReload) onReload();
  };

  return (
    <div className="space-y-4 max-w-4xl">
      <div className="bg-white rounded-2xl border p-5">
        <h2 className="font-bold mb-2">雲端概況</h2>
        {stats?.error ? <p className="text-red-600 text-sm">{stats.error}</p> :
          <p className="text-sm text-slate-600">學生 <b>{stats?.students ?? "…"}</b>　功課藍圖 <b>{stats?.hw ?? "…"}</b><br/>
          <span className="text-xs text-slate-400">上次匯入：{stats?.last || "尚未"}</span></p>}
      </div>
      <div className="bg-amber-50 border border-amber-200 rounded-2xl p-4 text-sm text-amber-900">
        <b>取得 JSON：</b>不要在編輯器 Run。請開 Apps Script 的 <b>/exec</b> 網址，全選複製。試驗期可分次匯入，正式前再全量一次。
      </div>
      <div className="bg-white rounded-2xl border p-5 space-y-3">
        <h2 className="font-bold">匯入</h2>
        <div className="flex gap-2 flex-wrap">
          <input className="flex-1 border rounded-lg px-3 py-2 text-sm" placeholder="https://script.google.com/.../exec" value={url} onChange={e=>setUrl(e.target.value)} />
          <button className="bg-sky-600 text-white font-bold px-4 py-2 rounded-lg text-sm" onClick={async()=>{
            try {
              const t = await (await fetch(url.trim())).text();
              setJson(t);
              setLog("已載入 "+t.length+" 字元\n");
            } catch(e) { alert(e.message); }
          }}>從網址載入</button>
        </div>
        <textarea className="w-full h-36 border rounded-xl p-3 text-xs mono" value={json} onChange={e=>setJson(e.target.value)} placeholder='{"students":[]...}' />
        <button className="bg-emerald-600 text-white font-bold px-4 py-2 rounded-lg text-sm" onClick={async()=>{
          try {
            const p = JSON.parse(json);
            await importPayload(p);
          } catch(e) { alert(e.message); setLog(l=>l+"錯誤:"+e.message+"\n"); }
        }}>開始匯入 Firestore</button>
        <pre className="bg-slate-900 text-emerald-400 text-xs p-3 rounded-xl h-28 overflow-auto mono">{log||"// 進度"}</pre>
      </div>
    </div>
  );
}

// ---------- Student ID mapping ----------
function IdMapView({ students, onReload }) {
  const [text, setText] = useState("");
  const [log, setLog] = useState("");
  const [deleteOld, setDeleteOld] = useState(true);

  const run = async () => {
    setLog("");
    const lines = text.trim().split("\n").map(l=>l.trim()).filter(Boolean);
    let ok=0, fail=0;
    for (const line of lines) {
      let cls, num, newId;
      if (line.includes("\t")) {
        const p = line.split("\t").map(x=>x.trim());
        if (p.length>=3) { cls=p[0]; num=p[1]; newId=p[2]; }
      } else if (line.includes(",")) {
        const p = line.split(",").map(x=>x.trim());
        if (p.length===2 && p[0].includes("-")) {
          const m = p[0].match(/^([A-Za-z0-9]+)-(\d+)$/);
          if (m) { cls=m[1]; num=m[2]; newId=p[1]; }
        } else if (p.length>=3) { cls=p[0]; num=p[1]; newId=p[2]; }
      }
      if (!cls || num===undefined || !newId) {
        setLog(l=>l+`略過無法解析：${line}\n`); fail++; continue;
      }
      newId = String(newId).trim();
      if (!/^s\d+/i.test(newId)) {
        setLog(l=>l+`警告：${newId} 不像 s12345678 格式，仍繼續\n`);
      }
      const match = students.find(s => String(s.class)===String(cls) && String(s.num)===String(num));
      if (!match) {
        // create fresh
        try {
          await db.collection("students").doc(newId).set({
            id: newId, sid: newId, class: cls, num: isNaN(Number(num))?num:Number(num),
            name: "", cohort: "", pin: randomPin(), active: true, updatedAt: new Date().toISOString()
          }, { merge: true });
          setLog(l=>l+`新建 ${cls}-${num} → ${newId}\n`);
          ok++;
        } catch(e) { setLog(l=>l+`失敗 ${line}: ${e.message}\n`); fail++; }
        continue;
      }
      if (match.id === newId) {
        setLog(l=>l+`已是 ${newId}（${cls}-${num}）\n`); ok++; continue;
      }
      try {
        await migrateStudentId(match.id, newId, { class: cls, num: isNaN(Number(num))?num:Number(num) });
        setLog(l=>l+`遷移 ${match.id} → ${newId}（${cls}-${num}）\n`);
        ok++;
      } catch(e) { setLog(l=>l+`失敗 ${line}: ${e.message}\n`); fail++; }
    }
    setLog(l=>l+`\n完成：成功 ${ok}，失敗/略過 ${fail}\n`);
    if (onReload) onReload();
  };

  return (
    <div className="max-w-3xl space-y-4">
      <div className="bg-white rounded-2xl border p-5 space-y-3">
        <h2 className="font-bold text-lg">學生 ID 對照補齊</h2>
        <p className="text-sm text-slate-600 leading-relaxed">
          目標主鍵格式：<b className="mono">s12345678</b>（學生編號）。班別／學號只作顯示。<br/>
          每行一種：<code className="bg-slate-100 px-1">S4A	3	s12345678</code> 或 <code className="bg-slate-100 px-1">S4A-3,s12345678</code>
        </p>
        <textarea className="w-full h-48 border rounded-xl p-3 text-sm mono" value={text} onChange={e=>setText(e.target.value)}
          placeholder={"S4A\t3\ts12345678\nS4A-5,s12345679"} />
        <button className="bg-indigo-600 text-white font-bold px-4 py-2 rounded-lg text-sm" onClick={run}>執行對照遷移</button>
        <pre className="bg-slate-900 text-emerald-400 text-xs p-3 rounded-xl h-40 overflow-auto mono">{log||"// 結果"}</pre>
      </div>
      <div className="bg-white rounded-2xl border p-5">
        <h3 className="font-bold mb-2 text-sm">目前學生（前 50）</h3>
        <div className="overflow-auto max-h-64 text-xs">
          <table className="min-w-full">
            <thead><tr className="text-left text-slate-500">{["ID","班","號","姓名"].map(h=><th key={h} className="px-2 py-1">{h}</th>)}</tr></thead>
            <tbody>
              {students.slice(0,50).map(s=>(
                <tr key={s.id} className="border-t">
                  <td className="px-2 py-1 mono font-bold">{s.id}</td>
                  <td className="px-2 py-1">{s.class}</td>
                  <td className="px-2 py-1">{s.num}</td>
                  <td className="px-2 py-1">{s.name}</td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>
      </div>
    </div>
  );
}

// ---------- Homework Settings ----------
function HwSettingsView({ students, homeworkMaps, setHomeworkMaps, currentCohort }) {
  const cohorts = useMemo(() => Array.from(new Set(students.map(s=>s.cohort).filter(Boolean))).sort(), [students]);
  const [selectedCohort, setSelectedCohort] = useState(currentCohort || cohorts[0] || "");
  const [hwId, setHwId] = useState("");
  const [hwTitle, setHwTitle] = useState("");
  const [pasteData, setPasteData] = useState("");
  const [editingOriginalId, setEditingOriginalId] = useState(null);
  const [busy, setBusy] = useState(false);

  const filtered = Object.keys(homeworkMaps||{}).filter(id => !homeworkMaps[id].cohort || homeworkMaps[id].cohort===selectedCohort).sort();

  const parseLines = (text) => {
    return text.trim().split("\n").map(line => {
      const clean = line.trim(); if (!clean) return null;
      let cols = clean.split("\t").map(c=>c.trim());
      if (cols.length < 6) {
        const multi = clean.split(/\s{2,}/).map(c=>c.trim()).filter(Boolean);
        if (multi.length>=6) cols = multi;
      }
      if (cols.length < 6) {
        const parts = clean.split(/\s+/).filter(Boolean);
        if (parts.length>=6) {
          const last = parts[parts.length-1];
          const isAns = /^[A-Da-d]([,]\s*[A-Da-d])*$/.test(last);
          let ans="", descParts=parts.slice(5);
          if (isAns) { ans=last.toUpperCase().replace(/\s+/g,""); descParts=parts.slice(5,-1); }
          cols = [parts[0],parts[1],parts[2],parts[3],parts[4],descParts.join(" "),ans];
        }
      }
      let maxScore = parseFloat(cols[2]); if (isNaN(maxScore)||maxScore<=0) maxScore=1;
      return {
        id: (cols[0]||"").trim(), type: (cols[1]||"LQ").toUpperCase(), max: maxScore,
        level: (cols[3]||"中").trim(), topicId: (cols[4]||"").trim(),
        topicDesc: (cols[5]||"").trim(), ans: (cols[6]||"").trim().toUpperCase()
      };
    }).filter(q => q && q.id && !String(q.id).includes("題目ID"));
  };

  const handleSave = async () => {
    if (!hwId || !hwTitle || !pasteData || !selectedCohort) return alert("請填寫完整");
    const questions = parseLines(pasteData);
    if (!questions.length) return alert("無法解析題目");
    const newId = hwId.trim();
    const oldId = editingOriginalId;
    setBusy(true);
    try {
      const data = { title: hwTitle, cohort: selectedCohort, questions };
      await saveHomeworkMap(newId, data);
      const next = { ...homeworkMaps, [newId]: { ...data, _id: newId } };
      if (oldId && oldId !== newId) {
        // migrate scores
        const stuSnap = await db.collection("students").get();
        for (const d of stuSnap.docs) {
          const ref = db.collection("scores").doc(d.id).collection("homeworks").doc(oldId);
          const snap = await ref.get();
          if (snap.exists) {
            await db.collection("scores").doc(d.id).collection("homeworks").doc(newId).set(snap.data(), { merge:true });
            await ref.delete();
          }
        }
        await deleteHomeworkMap(oldId);
        delete next[oldId];
      }
      setHomeworkMaps(next);
      setHwId(""); setHwTitle(""); setPasteData(""); setEditingOriginalId(null);
      alert("已儲存 " + newId);
    } catch(e) { alert(e.message); }
    setBusy(false);
  };

  const handleDelete = async (id) => {
    if (!confirm("刪除功課 "+id+" 及其成績？")) return;
    setBusy(true);
    try {
      await deleteHomeworkMap(id);
      const stuSnap = await db.collection("students").get();
      for (const d of stuSnap.docs) {
        try { await deleteHomeworkScore(d.id, id); } catch(_){}
      }
      const next = { ...homeworkMaps }; delete next[id];
      setHomeworkMaps(next);
    } catch(e) { alert(e.message); }
    setBusy(false);
  };

  const loadEdit = (id) => {
    const hw = homeworkMaps[id]; if (!hw) return;
    setHwId(id); setHwTitle(hw.title||"");
    setPasteData((hw.questions||[]).map(q => [q.id,q.type,q.max,q.level,q.topicId,q.topicDesc,q.ans||""].join("\t")).join("\n"));
    setEditingOriginalId(id);
    setSelectedCohort(hw.cohort||selectedCohort);
  };

  return (
    <div className="grid lg:grid-cols-2 gap-4">
      <div className="bg-white rounded-2xl border p-4 space-y-2">
        <div className="flex justify-between items-center">
          <h2 className="font-bold">功課藍圖</h2>
          <select className="border rounded px-2 py-1 text-sm" value={selectedCohort} onChange={e=>setSelectedCohort(e.target.value)}>
            {cohorts.map(c=><option key={c} value={c}>{c}</option>)}
          </select>
        </div>
        <div className="space-y-1 max-h-[70vh] overflow-auto">
          {filtered.map(id => (
            <div key={id} className="border rounded-xl p-3 flex justify-between gap-2 items-start hover:bg-slate-50">
              <div className="min-w-0">
                <div className="font-bold text-sm mono text-indigo-700">{id}</div>
                <div className="text-sm font-semibold truncate">{homeworkMaps[id].title}</div>
                <div className="text-[11px] text-slate-400">{(homeworkMaps[id].questions||[]).length} 題 · {homeworkMaps[id].cohort}</div>
              </div>
              <div className="flex gap-1 shrink-0">
                <button className="text-xs px-2 py-1 bg-indigo-50 text-indigo-700 rounded font-bold" onClick={()=>loadEdit(id)}>編輯</button>
                <button className="text-xs px-2 py-1 bg-rose-50 text-rose-700 rounded font-bold" onClick={()=>handleDelete(id)}>刪</button>
              </div>
            </div>
          ))}
          {!filtered.length && <p className="text-slate-400 text-sm p-4">此群組尚無功課</p>}
        </div>
      </div>
      <div className="bg-white rounded-2xl border p-4 space-y-3">
        <h2 className="font-bold">{editingOriginalId ? `編輯 ${editingOriginalId}` : "新增功課"}</h2>
        <input className="w-full border rounded-lg px-3 py-2 text-sm" placeholder="編號 如 2629_S4_03" value={hwId} onChange={e=>setHwId(e.target.value)} />
        <input className="w-full border rounded-lg px-3 py-2 text-sm" placeholder="標題" value={hwTitle} onChange={e=>setHwTitle(e.target.value)} />
        <select className="w-full border rounded-lg px-3 py-2 text-sm" value={selectedCohort} onChange={e=>setSelectedCohort(e.target.value)}>
          {cohorts.map(c=><option key={c} value={c}>{c}</option>)}
        </select>
        <textarea className="w-full h-56 border rounded-xl p-3 text-xs mono" placeholder="題目ID	題型	滿分	深淺	topicId	描述	答案" value={pasteData} onChange={e=>setPasteData(e.target.value)} />
        <div className="flex gap-2">
          <button disabled={busy} className="bg-amber-500 text-white font-bold px-4 py-2 rounded-lg text-sm" onClick={handleSave}>{busy?"…":"儲存"}</button>
          <button className="bg-slate-100 font-bold px-4 py-2 rounded-lg text-sm" onClick={()=>{setHwId("");setHwTitle("");setPasteData("");setEditingOriginalId(null);}}>取消</button>
        </div>
      </div>
    </div>
  );
}

// ---------- Grade / status tracking ----------
function HwGradeView({ activeStudents, homeworkMaps, homeworkScores, setHomeworkScores, currentCohort }) {
  const availableHws = useMemo(() => Object.keys(homeworkMaps||{}).filter(id => !homeworkMaps[id].cohort || homeworkMaps[id].cohort===currentCohort).sort(), [homeworkMaps, currentCohort]);
  const [selectedHw, setSelectedHw] = useState(availableHws[0]||"");
  const [selectedStudentId, setSelectedStudentId] = useState("");
  const [edit, setEdit] = useState(null);
  const [filter, setFilter] = useState("ALL");
  const [saveStatus, setSaveStatus] = useState("idle");
  const timer = useRef(null);
  const editRef = useRef(null);
  const sidRef = useRef("");
  const hwRef = useRef("");
  useEffect(()=>{ editRef.current=edit; },[edit]);
  useEffect(()=>{ sidRef.current=selectedStudentId; },[selectedStudentId]);
  useEffect(()=>{ hwRef.current=selectedHw; },[selectedHw]);
  useEffect(()=>{
    if (availableHws.length && !availableHws.includes(selectedHw)) setSelectedHw(availableHws[0]||"");
  },[availableHws]);

  const map = homeworkMaps[selectedHw];

  const openStudent = (sid) => {
    if (timer.current) { clearTimeout(timer.current); timer.current=null; }
    setSelectedStudentId(sid);
    const rec = homeworkScores[sid]?.[selectedHw];
    setEdit(rec ? { ...rec, scores: { ...(rec.scores||{}) } } : { scores:{}, remakeStatus:"MISSING", remarks:"", gradingDate:"", remakeDate:"" });
    setSaveStatus("idle");
  };

  const persist = async (record, sid, hw) => {
    setSaveStatus("saving");
    try {
      await saveHomeworkScore(sid, hw, record);
      setHomeworkScores(prev => ({
        ...prev,
        [sid]: { ...(prev[sid]||{}), [hw]: record }
      }));
      setSaveStatus("saved");
      setTimeout(()=>setSaveStatus("idle"), 1500);
    } catch(e) { setSaveStatus("idle"); alert(e.message); }
  };

  const scheduleSave = (next) => {
    setEdit(next);
    if (timer.current) clearTimeout(timer.current);
    timer.current = setTimeout(() => {
      const sid = sidRef.current, hw = hwRef.current;
      if (!sid || !hw) return;
      persist(next, sid, hw);
    }, 800);
  };

  const filteredStudents = activeStudents.filter(s => {
    if (filter==="ALL") return true;
    const st = homeworkScores[s.id]?.[selectedHw]?.remakeStatus || "MISSING";
    return st === filter;
  });

  if (!map) return <div className="p-8 text-slate-400">請先在藍圖設定功課，或切換群組。</div>;

  return (
    <div className="grid lg:grid-cols-5 gap-4">
      <div className="lg:col-span-2 bg-white rounded-2xl border p-4 space-y-3">
        <select className="w-full border rounded-lg px-2 py-2 text-sm font-bold" value={selectedHw} onChange={e=>{setSelectedHw(e.target.value); setSelectedStudentId(""); setEdit(null);}}>
          {availableHws.map(id=><option key={id} value={id}>{id} — {homeworkMaps[id].title}</option>)}
        </select>
        <div className="flex flex-wrap gap-1">
          {["ALL","MISSING","PENDING","DONE","PERFECT","EXEMPT"].map(f=>(
            <button key={f} onClick={()=>setFilter(f)} className={`text-[10px] font-bold px-2 py-1 rounded-full border ${filter===f?"bg-indigo-600 text-white border-indigo-600":"bg-white text-slate-600"}`}>
              {f==="ALL"?"全部":(STATUS_META[f]?.label||f)}
            </button>
          ))}
        </div>
        <div className="max-h-[65vh] overflow-auto space-y-1">
          {filteredStudents.map(s => {
            const st = homeworkScores[s.id]?.[selectedHw]?.remakeStatus || "MISSING";
            return (
              <button key={s.id} onClick={()=>openStudent(s.id)}
                className={`w-full text-left px-3 py-2 rounded-xl border text-sm flex justify-between items-center ${selectedStudentId===s.id?"border-indigo-400 bg-indigo-50":"border-slate-100 hover:bg-slate-50"}`}>
                <span><b>{s.class}-{s.num}</b> {s.name} <span className="text-[10px] text-slate-400 mono">{s.id}</span></span>
                <Badge status={st} />
              </button>
            );
          })}
        </div>
      </div>
      <div className="lg:col-span-3 bg-white rounded-2xl border p-4">
        {!edit || !selectedStudentId ? <p className="text-slate-400 p-8 text-center">選擇學生開始批改</p> : (
          <div className="space-y-3">
            <div className="flex justify-between items-center">
              <div className="font-bold">{activeStudents.find(x=>x.id===selectedStudentId)?.name} · {selectedHw}</div>
              <div className="text-xs text-slate-400">{saveStatus==="saving"?"儲存中…":saveStatus==="saved"?"已存":""}</div>
            </div>
            <div className="flex flex-wrap gap-2">
              {Object.keys(STATUS_META).map(st=>(
                <button key={st} className={`text-xs font-bold px-2 py-1 rounded-lg border ${edit.remakeStatus===st?"ring-2 ring-indigo-400":""} ${STATUS_META[st].cls}`}
                  onClick={()=>scheduleSave({ ...edit, remakeStatus: st, remakeDate: st==="DONE"?new Date().toISOString().slice(0,10):(edit.remakeDate||"") })}>
                  {STATUS_META[st].label}
                </button>
              ))}
            </div>
            <div className="space-y-2 max-h-[55vh] overflow-auto">
              {(map.questions||[]).map(q => (
                <div key={q.id} className="border rounded-xl p-2 flex gap-2 items-center">
                  <div className="w-24 shrink-0">
                    <div className="text-xs font-bold mono">{q.id}</div>
                    <div className="text-[10px] text-slate-400">{q.type} /{q.max}</div>
                  </div>
                  <div className="flex-1 text-xs text-slate-600 truncate" title={q.topicDesc}>{q.topicId} {q.topicDesc}</div>
                  {q.type==="MC" ? (
                    <input className="w-16 border rounded px-2 py-1 text-center font-bold uppercase" maxLength={4}
                      value={edit.scores?.[q.id] ?? ""} onChange={e=>{
                        const v=e.target.value.toUpperCase();
                        scheduleSave({ ...edit, scores:{...edit.scores, [q.id]:v}, remakeStatus: edit.remakeStatus==="MISSING"?"PENDING":edit.remakeStatus });
                      }} />
                  ) : (
                    <input type="number" className="w-20 border rounded px-2 py-1 text-center font-bold"
                      value={edit.scores?.[q.id] ?? ""} onChange={e=>{
                        scheduleSave({ ...edit, scores:{...edit.scores, [q.id]:e.target.value}, remakeStatus: edit.remakeStatus==="MISSING"?"PENDING":edit.remakeStatus });
                      }} />
                  )}
                  {q.type==="MC" && q.ans && (
                    <span className={`text-xs font-bold ${(edit.scores?.[q.id]||"").toString().toUpperCase()===q.ans.toString().toUpperCase()?"text-emerald-600":"text-rose-500"}`}>
                      答:{q.ans}
                    </span>
                  )}
                </div>
              ))}
            </div>
            <textarea className="w-full border rounded-xl p-2 text-sm" rows={2} placeholder="備註"
              value={edit.remarks||""} onChange={e=>scheduleSave({ ...edit, remarks:e.target.value })} />
          </div>
        )}
      </div>
    </div>
  );
}

// ---------- Summary table ----------
function HwSummaryView({ activeStudents, homeworkMaps, homeworkScores, setHomeworkScores, currentCohort }) {
  const availableHws = useMemo(() => Object.keys(homeworkMaps||{}).filter(id => !homeworkMaps[id].cohort || homeworkMaps[id].cohort===currentCohort).sort(), [homeworkMaps, currentCohort]);
  const [included, setIncluded] = useState({});
  useEffect(() => {
    const o={}; availableHws.forEach(h=>o[h]=true); setIncluded(o);
  }, [availableHws.join("|")]);

  const hwMax = useMemo(() => {
    const m={};
    availableHws.forEach(id => { m[id]=(homeworkMaps[id].questions||[]).reduce((a,q)=>a+(q.max||0),0); });
    return m;
  }, [availableHws, homeworkMaps]);

  const scoreOf = (sid, hwId) => {
    const rec = homeworkScores[sid]?.[hwId];
    if (!rec || rec.remakeStatus==="EXEMPT") return null;
    if (rec.remakeStatus==="MISSING" && (!rec.scores || !Object.keys(rec.scores).length)) return null;
    const map = homeworkMaps[hwId];
    if (!map) return null;
    let t=0;
    (map.questions||[]).forEach(q => {
      const val = rec.scores?.[q.id];
      if (val===undefined||val===null||String(val).trim()==="") return;
      if (q.type==="MC") {
        if (q.ans && String(val).toUpperCase()===String(q.ans).toUpperCase().split(",")[0]) t+=q.max;
        else if (q.ans) {
          const corrects = q.ans.toString().split(",").map(a=>a.trim().toUpperCase());
          if (corrects.includes(String(val).trim().toUpperCase())) t+=q.max;
        }
      } else t += parseFloat(val)||0;
    });
    return t;
  };

  return (
    <div className="bg-white rounded-2xl border p-4 space-y-3">
      <h2 className="font-bold">功課成績總表</h2>
      <div className="flex flex-wrap gap-2">
        {availableHws.map(id=>(
          <label key={id} className="text-xs font-bold flex items-center gap-1 border rounded-lg px-2 py-1">
            <input type="checkbox" checked={!!included[id]} onChange={()=>setIncluded(p=>({...p,[id]:!p[id]}))} />
            {id}
          </label>
        ))}
      </div>
      <div className="overflow-auto max-h-[70vh]">
        <table className="min-w-full text-sm">
          <thead className="sticky top-0 bg-slate-50">
            <tr>
              <th className="text-left px-2 py-2">班</th>
              <th className="text-left px-2 py-2">號</th>
              <th className="text-left px-2 py-2">姓名</th>
              {availableHws.filter(h=>included[h]).map(h=>(
                <th key={h} className="text-center px-2 py-2 text-xs">{h}<div className="text-[10px] font-normal text-slate-400">/{hwMax[h]}</div></th>
              ))}
            </tr>
          </thead>
          <tbody>
            {activeStudents.map(s=>(
              <tr key={s.id} className="border-t">
                <td className="px-2 py-1">{s.class}</td>
                <td className="px-2 py-1">{s.num}</td>
                <td className="px-2 py-1 font-semibold">{s.name}</td>
                {availableHws.filter(h=>included[h]).map(h=>{
                  const rec = homeworkScores[s.id]?.[h];
                  const sc = scoreOf(s.id,h);
                  const st = rec?.remakeStatus || "MISSING";
                  return (
                    <td key={h} className="px-2 py-1 text-center">
                      <div className="font-bold">{sc===null?"-":sc}</div>
                      <Badge status={st} />
                    </td>
                  );
                })}
              </tr>
            ))}
          </tbody>
        </table>
      </div>
    </div>
  );
}

// ---------- Chase missing / remake ----------
function HwChaseView({ activeStudents, homeworkMaps, homeworkScores, setHomeworkScores, currentCohort }) {
  const availableHws = useMemo(() => Object.keys(homeworkMaps||{}).filter(id => !homeworkMaps[id].cohort || homeworkMaps[id].cohort===currentCohort).sort(), [homeworkMaps, currentCohort]);
  const [hwFilter, setHwFilter] = useState("ALL");
  const [typeFilter, setTypeFilter] = useState("BOTH"); // MISSING | PENDING | BOTH

  const rows = useMemo(() => {
    const list = [];
    activeStudents.forEach(s => {
      availableHws.forEach(hw => {
        if (hwFilter!=="ALL" && hw!==hwFilter) return;
        const st = homeworkScores[s.id]?.[hw]?.remakeStatus || "MISSING";
        if (typeFilter==="BOTH" && st!=="MISSING" && st!=="PENDING") return;
        if (typeFilter==="MISSING" && st!=="MISSING") return;
        if (typeFilter==="PENDING" && st!=="PENDING") return;
        list.push({ student: s, hw, status: st, rec: homeworkScores[s.id]?.[hw] });
      });
    });
    list.sort((a,b)=> String(a.student.class).localeCompare(String(b.student.class)) || (Number(a.student.num)||0)-(Number(b.student.num)||0) || a.hw.localeCompare(b.hw));
    return list;
  }, [activeStudents, availableHws, homeworkScores, hwFilter, typeFilter]);

  const setStatus = async (sid, hw, status) => {
    const prev = homeworkScores[sid]?.[hw] || { scores:{} };
    const next = { ...prev, remakeStatus: status, remakeDate: status==="DONE"?new Date().toISOString().slice(0,10):(prev.remakeDate||"") };
    await saveHomeworkScore(sid, hw, next);
    setHomeworkScores(p => ({ ...p, [sid]: { ...(p[sid]||{}), [hw]: next } }));
  };

  return (
    <div className="bg-white rounded-2xl border p-4 space-y-3">
      <h2 className="font-bold text-lg">追欠交功課及改正區</h2>
      <p className="text-sm text-slate-500">集中顯示未交（MISSING）與欠改正（PENDING），可直接改狀態。</p>
      <div className="flex flex-wrap gap-2">
        <select className="border rounded-lg px-2 py-1 text-sm" value={hwFilter} onChange={e=>setHwFilter(e.target.value)}>
          <option value="ALL">全部功課</option>
          {availableHws.map(h=><option key={h} value={h}>{h} — {homeworkMaps[h].title}</option>)}
        </select>
        <select className="border rounded-lg px-2 py-1 text-sm" value={typeFilter} onChange={e=>setTypeFilter(e.target.value)}>
          <option value="BOTH">未交 + 欠改正</option>
          <option value="MISSING">只看未交</option>
          <option value="PENDING">只看欠改正</option>
        </select>
        <span className="text-sm text-slate-500 self-center">共 {rows.length} 筆</span>
      </div>
      <div className="overflow-auto max-h-[70vh]">
        <table className="min-w-full text-sm">
          <thead className="sticky top-0 bg-slate-50">
            <tr>
              {["班","號","姓名","學生ID","功課","狀態","快速操作"].map(h=><th key={h} className="text-left px-2 py-2 text-xs text-slate-500">{h}</th>)}
            </tr>
          </thead>
          <tbody>
            {rows.map((r,i)=>(
              <tr key={r.student.id+"-"+r.hw+"-"+i} className="border-t">
                <td className="px-2 py-1">{r.student.class}</td>
                <td className="px-2 py-1">{r.student.num}</td>
                <td className="px-2 py-1 font-semibold">{r.student.name}</td>
                <td className="px-2 py-1 mono text-xs">{r.student.id}</td>
                <td className="px-2 py-1"><span className="mono text-xs text-indigo-700">{r.hw}</span><div className="text-[10px] text-slate-400">{homeworkMaps[r.hw]?.title}</div></td>
                <td className="px-2 py-1"><Badge status={r.status}/></td>
                <td className="px-2 py-1">
                  <div className="flex flex-wrap gap-1">
                    {r.status==="MISSING" && <button className="text-[10px] font-bold px-2 py-0.5 rounded bg-slate-100" onClick={()=>setStatus(r.student.id,r.hw,"PENDING")}>標為已交待改</button>}
                    {r.status==="PENDING" && <button className="text-[10px] font-bold px-2 py-0.5 rounded bg-blue-100 text-blue-700" onClick={()=>setStatus(r.student.id,r.hw,"DONE")}>已改正</button>}
                    <button className="text-[10px] font-bold px-2 py-0.5 rounded bg-emerald-50 text-emerald-700" onClick={()=>setStatus(r.student.id,r.hw,"PERFECT")}>完美</button>
                    <button className="text-[10px] font-bold px-2 py-0.5 rounded bg-amber-50 text-amber-700" onClick={()=>setStatus(r.student.id,r.hw,"EXEMPT")}>豁免</button>
                  </div>
                </td>
              </tr>
            ))}
            {!rows.length && <tr><td colSpan={7} className="px-2 py-8 text-center text-slate-400">沒有符合的欠交／欠改正紀錄 🎉</td></tr>}
          </tbody>
        </table>
      </div>
    </div>
  );
}

// ---------- App ----------
function App() {
  const [view, setView] = useState("import");
  const [students, setStudents] = useState([]);
  const [homeworkMaps, setHomeworkMaps] = useState({});
  const [homeworkScores, setHomeworkScores] = useState({});
  const [loading, setLoading] = useState(true);
  const [cohort, setCohort] = useState("所有學生");

  const reload = useCallback(async () => {
    setLoading(true);
    try {
      const stu = await loadAllStudents();
      setStudents(stu);
      const maps = await loadHomeworkMaps();
      setHomeworkMaps(maps);
      const scores = await loadHomeworkScores(stu.map(s=>s.id));
      setHomeworkScores(scores);
      const cohorts = Array.from(new Set(stu.map(s=>s.cohort).filter(Boolean)));
      if (cohorts.length && (cohort==="所有學生" || !cohorts.includes(cohort))) {
        // keep 所有學生 as option
      }
    } catch(e) { alert("載入失敗："+e.message); }
    setLoading(false);
  }, []);

  useEffect(()=>{ reload(); }, [reload]);

  const cohorts = useMemo(() => ["所有學生", ...Array.from(new Set(students.map(s=>s.cohort).filter(Boolean))).sort()], [students]);
  const activeStudents = useMemo(() => cohort==="所有學生" ? students : students.filter(s=>s.cohort===cohort), [students, cohort]);

  return (
    <div className="flex min-h-screen">
      <Sidebar view={view} setView={setView} />
      <main className="flex-1 p-6 overflow-auto">
        <div className="flex flex-wrap gap-3 items-center mb-4">
          <label className="text-sm font-bold text-slate-600">群組</label>
          <select className="border rounded-lg px-3 py-1.5 text-sm font-semibold" value={cohort} onChange={e=>setCohort(e.target.value)}>
            {cohorts.map(c=><option key={c} value={c}>{c}</option>)}
          </select>
          <button className="text-sm text-indigo-600 font-bold" onClick={reload}>重新載入雲端</button>
          {loading && <span className="text-xs text-slate-400">載入中…</span>}
        </div>
        {view==="import" && <ImportView onReload={reload} />}
        {view==="idMap" && <IdMapView students={students} onReload={reload} />}
        {view==="pins" && <PinsView students={students} />}
        {view==="hwSettings" && <HwSettingsView students={students} homeworkMaps={homeworkMaps} setHomeworkMaps={setHomeworkMaps} currentCohort={cohort==="所有學生"?(cohorts[1]||""):cohort} />}
        {view==="hwGrade" && <HwGradeView activeStudents={activeStudents} homeworkMaps={homeworkMaps} homeworkScores={homeworkScores} setHomeworkScores={setHomeworkScores} currentCohort={cohort==="所有學生"?"":cohort} />}
        {view==="hwSummary" && <HwSummaryView activeStudents={activeStudents} homeworkMaps={homeworkMaps} homeworkScores={homeworkScores} setHomeworkScores={setHomeworkScores} currentCohort={cohort==="所有學生"?"":cohort} />}
        {view==="hwChase" && <HwChaseView activeStudents={activeStudents} homeworkMaps={homeworkMaps} homeworkScores={homeworkScores} setHomeworkScores={setHomeworkScores} currentCohort={cohort==="所有學生"?"":cohort} />}
      </main>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
