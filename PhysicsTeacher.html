function QuizSettingsView({ students, quizMaps, setQuizMaps, currentCohort }) {
  const cohorts = useMemo(() => Array.from(new Set(students.map(s => s.cohort).filter(Boolean))).sort(), [students]);
  const [selectedCohort, setSelectedCohort] = useState(currentCohort && currentCohort !== "所有學生" ? currentCohort : (cohorts[0] || ""));
  const [quizId, setQuizId] = useState("");
  const [quizTitle, setQuizTitle] = useState("");
  const [pasteData, setPasteData] = useState("");
  const [editingOriginalId, setEditingOriginalId] = useState(null);
  const [assignCohort, setAssignCohort] = useState("");
  const [busy, setBusy] = useState(false);

  useEffect(() => {
    if (currentCohort && currentCohort !== "所有學生") setSelectedCohort(currentCohort);
  }, [currentCohort]);

  const listIds = useMemo(() => Object.keys(quizMaps || {}).sort(), [quizMaps]);

  const parseLines = (text) => {
    return text.trim().split("\n").map(line => {
      const clean = line.trim(); if (!clean) return null;
      let cols = clean.split("\t").map(c => c.trim());
      if (cols.length < 6) {
        const multi = clean.split(/\s{2,}/).map(c => c.trim()).filter(Boolean);
        if (multi.length >= 6) cols = multi;
      }
      let maxScore = parseFloat(cols[2]); if (isNaN(maxScore) || maxScore <= 0) maxScore = 1;
      const type = (cols[1] || "MC").toUpperCase();
      return {
        id: (cols[0] || "").trim(),
        type,
        max: maxScore,
        level: (cols[3] || "中").trim(),
        topicId: (cols[4] || "").trim(),
        topicDesc: (cols[5] || "").trim(),
        ans: (cols[6] || "").trim().toUpperCase()
      };
    }).filter(q => q && q.id && !String(q.id).includes("題目") && !String(q.id).includes("編號"));
  };

  const loadEdit = (id) => {
    const m = quizMaps[id];
    if (!m) return;
    setEditingOriginalId(id);
    setQuizId(id);
    setQuizTitle(m.title || "");
    setAssignCohort(m.cohort || "");
    let text = "";
    (m.questions || []).forEach(q => {
      text += `${q.id}\t${q.type}\t${q.max}\t${q.level || "中"}\t${q.topicId || ""}\t${q.topicDesc || ""}\t${q.ans || ""}\n`;
    });
    setPasteData(text);
  };

  const handleSave = async () => {
    if (!quizId.trim() || !quizTitle.trim()) return alert("請填寫小測編號與標題");
    const questions = parseLines(pasteData);
    if (!questions.length) return alert("無法解析題目（需要：題號 題型 滿分 難度 課題編號 描述 [答案]）");
    let cohortVal = assignCohort;
    if (cohortVal === "所有學生") cohortVal = "";
    setBusy(true);
    try {
      const newId = quizId.trim();
      const oldId = editingOriginalId;
      const data = { title: quizTitle.trim(), questions, cohort: cohortVal || "" };
      await saveQuizMap(newId, data);
      const next = { ...quizMaps, [newId]: { ...data, _id: newId } };
      if (oldId && oldId !== newId) {
        await deleteQuizMap(oldId);
        delete next[oldId];
        const stuSnap = await db.collection("students").get();
        for (const d of stuSnap.docs) {
          const ref = db.collection("scores").doc(d.id).collection("quizzes").doc(oldId);
          const snap = await ref.get();
          if (snap.exists) {
            await db.collection("scores").doc(d.id).collection("quizzes").doc(newId).set(snap.data(), { merge: true });
            await ref.delete();
          }
        }
      }
      setQuizMaps(next);
      setEditingOriginalId(newId);
      alert("已儲存小測藍圖" + (data.cohort ? `（群組：${data.cohort}）` : "（所有群組通用）"));
    } catch (e) { alert(e.message); }
    setBusy(false);
  };

  const handleDelete = async (id) => {
    if (!confirm(`確定刪除小測藍圖「${id}」？`)) return;
    setBusy(true);
    try {
      await deleteQuizMap(id);
      const next = { ...quizMaps };
      delete next[id];
      setQuizMaps(next);
      if (editingOriginalId === id) {
        setEditingOriginalId(null); setQuizId(""); setQuizTitle(""); setPasteData(""); setAssignCohort("");
      }
    } catch (e) { alert(e.message); }
    setBusy(false);
  };

  const saveCohortOnly = async (id, cohort) => {
    const m = quizMaps[id];
    if (!m) return;
    const c = cohort === "所有學生" ? "" : cohort;
    try {
      await saveQuizMap(id, { ...m, cohort: c });
      setQuizMaps(prev => ({ ...prev, [id]: { ...m, cohort: c } }));
    } catch (e) { alert(e.message); }
  };

  const buildQuizCsvPrompt = () => {
    const syllabus = getSyllabusTableText();
    return `【身份】你是香港 DSE 物理科老師／出題助手。

【任務】我會上傳一份小測（PDF／Word／圖片）。請為每一小題產出 Tab 分隔列，方便貼入系統。

【課程大綱參考】（topicId 必須從下列課題編號選用）
${syllabus}

【規則】
1. 題號：MC1、MC2…／LQ1a、LQ1bi…
2. 題型：MC 或 LQ
3. 滿分：MC 通常 1；LQ 按分
4. 難度：淺／中／深
5. topicId：必須用上方大綱編號；topicDesc：20–30 字
6. 答案：MC 填 A/B/C/D；LQ 可留空

【輸出】只輸出資料行（可含表頭一行），Tab 分隔：
題號	題型	滿分	難度	topicId	topicDesc	答案`;
  };

  return (
    <div className="space-y-4">
      <div className="grid lg:grid-cols-5 gap-4">
        <div className="lg:col-span-2 bg-white rounded-2xl border p-4 space-y-3">
          <h2 className="font-bold text-lg">小測列表</h2>
          <p className="text-sm text-slate-600">無群組 = 所有群組可見。可在此為舊小測補上群組。</p>
          <div className="max-h-[65vh] overflow-auto space-y-2">
            {listIds.map(id => {
              const m = quizMaps[id];
              return (
                <div key={id} className={`border rounded-xl p-3 ${editingOriginalId===id?"border-indigo-400 bg-indigo-50":"border-slate-200"}`}>
                  <button className="w-full text-left" onClick={() => loadEdit(id)}>
                    <div className="font-bold text-base mono text-indigo-700">{id}</div>
                    <div className="text-sm font-semibold text-slate-800 truncate">{m.title}</div>
                    <div className="text-sm text-slate-500 mt-0.5">{(m.questions||[]).length} 題 · {m.cohort ? `群組 ${m.cohort}` : "所有群組通用"}</div>
                  </button>
                  <div className="mt-2 flex gap-2 items-center">
                    <select className="text-sm border rounded-lg flex-1 py-1.5 px-2 font-semibold" value={m.cohort || "所有學生"}
                      onChange={e => saveCohortOnly(id, e.target.value)}>
                      <option value="所有學生">所有群組</option>
                      {cohorts.map(c => <option key={c} value={c}>{c}</option>)}
                    </select>
                    <button className="text-sm text-rose-600 font-bold px-2" onClick={() => handleDelete(id)}>刪除</button>
                  </div>
                </div>
              );
            })}
            {!listIds.length && <p className="text-slate-400 text-sm">尚無小測，請右側新增或匯入。</p>}
          </div>
        </div>
        <div className="lg:col-span-3 bg-white rounded-2xl border p-5 space-y-4">
          <h2 className="font-bold text-lg">{editingOriginalId ? `編輯：${editingOriginalId}` : "新增小測"}</h2>
          <div className="grid sm:grid-cols-2 gap-3">
            <label className="text-sm font-bold text-slate-600">小測編號
              <input className="mt-1 w-full border-2 rounded-lg px-3 py-2 text-sm font-bold" value={quizId} onChange={e=>setQuizId(e.target.value)} />
            </label>
            <label className="text-sm font-bold text-slate-600">標題
              <input className="mt-1 w-full border-2 rounded-lg px-3 py-2 text-sm" value={quizTitle} onChange={e=>setQuizTitle(e.target.value)} />
            </label>
            <label className="text-sm font-bold text-slate-600">所屬群組
              <select className="mt-1 w-full border-2 rounded-lg px-3 py-2 text-sm" value={assignCohort || "所有學生"} onChange={e=>setAssignCohort(e.target.value === "所有學生" ? "" : e.target.value)}>
                <option value="所有學生">所有群組通用</option>
                {cohorts.map(c => <option key={c} value={c}>{c}</option>)}
              </select>
            </label>
            <div className="text-sm text-slate-500 flex items-end pb-2">新建建議選目前群組「{selectedCohort || "—"}」</div>
          </div>
          <label className="text-sm font-bold text-slate-600 block">題目（Tab：題號 題型 滿分 難度 topicId 描述 [答案]）
            <textarea className="mt-1 w-full border-2 rounded-xl p-3 text-sm mono h-52" value={pasteData} onChange={e=>setPasteData(e.target.value)}
              placeholder={"MC1\tMC\t1\t淺\t2.1.1\t辨識單位\tB"} />
          </label>
          <div className="flex flex-wrap gap-2">
            <button disabled={busy} className="bg-indigo-600 text-white font-bold px-5 py-2.5 rounded-xl text-sm disabled:opacity-50" onClick={handleSave}>
              {busy ? "儲存中…" : "儲存到 Firebase"}
            </button>
            <button className="border-2 font-bold px-5 py-2.5 rounded-xl text-sm" onClick={() => {
              setEditingOriginalId(null); setQuizId(""); setQuizTitle(""); setPasteData("");
              setAssignCohort(selectedCohort || "");
            }}>清空／新增</button>
          </div>
        </div>
      </div>
      <div className="rounded-2xl border-2 border-violet-300 bg-violet-50 p-5 space-y-3">
        <div className="font-black text-violet-900 text-lg">AI Prompt · 生成小測藍圖表格</div>
        <p className="text-sm text-violet-800">上傳小測卷後，用此 Prompt 生成含 <b>topicId</b> 的 Tab 表格（已附課程大綱）。</p>
        <button className="bg-violet-600 hover:bg-violet-700 text-white font-black px-6 py-3 rounded-xl text-base"
          onClick={() => navigator.clipboard.writeText(buildQuizCsvPrompt()).then(()=>alert("已複製")).catch(()=>alert("失敗"))}>
          複製 AI Prompt（含 Syllabus / Topic ID）
        </button>
      </div>
    </div>
  );
}

function QuizStudentAnalysisView({ activeStudents, quizMaps, currentCohort }) {
  const [sid, setSid] = useState(activeStudents[0]?.id || "");
  const [scores, setScores] = useState({});
  const [loading, setLoading] = useState(false);
  const chartRef = useRef(null);
  const chartInst = useRef(null);
  const [aiMc, setAiMc] = useState(10);
  const [aiLq, setAiLq] = useState(2);
  const [aiLevel, setAiLevel] = useState("中");
  const [aiExtra, setAiExtra] = useState({ practice: true, explainImg: false, ppt: false, notes: false });
  const [selectedQuizzes, setSelectedQuizzes] = useState([]);

  const visibleQuizzes = useMemo(
    () => Object.keys(quizMaps || {}).filter(id => quizVisibleForCohort(quizMaps[id], currentCohort)).sort(),
    [quizMaps, currentCohort]
  );

  useEffect(() => {
    if (activeStudents.length && !activeStudents.find(s => s.id === sid)) setSid(activeStudents[0].id);
  }, [activeStudents]);

  useEffect(() => {
    if (!sid) return;
    let cancelled = false;
    (async () => {
      setLoading(true);
      const data = await loadAllQuizScoresForStudent(sid);
      if (!cancelled) {
        setScores(data);
        // 預設勾選有成績的小測
        const withScore = visibleQuizzes.filter(qid => {
          const rec = data[qid];
          return rec && Object.keys(rec).some(k => !["updatedAt","_id"].includes(k) && rec[k] !== "" && rec[k] != null);
        });
        setSelectedQuizzes(withScore.length ? withScore : visibleQuizzes.slice());
        setLoading(false);
      }
    })();
    return () => { cancelled = true; };
  }, [sid, visibleQuizzes.join("|")]);

  const rows = useMemo(() => {
    return visibleQuizzes.map(qid => {
      const map = quizMaps[qid];
      const rec = scores[qid];
      if (!map) return null;
      let total = 0, max = 0, any = false;
      (map.questions || []).forEach(q => {
        max += (q.max || 0);
        if (!rec) return;
        const raw = rec[q.id];
        if (raw === undefined || raw === null || String(raw).trim() === "") return;
        any = true;
        const sc = quizQuestionScore(q, raw);
        if (sc != null) total += sc;
      });
      const pct = any && max > 0 ? (total / max) * 100 : null;
      return { qid, title: map.title || qid, total: any ? total : null, max, pct };
    }).filter(Boolean);
  }, [visibleQuizzes, quizMaps, scores]);

  // 課題熱力：依 topicId 彙總（所選小測）
  const topicStats = useMemo(() => {
    const bag = {};
    const qids = selectedQuizzes.length ? selectedQuizzes : visibleQuizzes;
    qids.forEach(qid => {
      const map = quizMaps[qid];
      const rec = scores[qid];
      if (!map || !rec) return;
      (map.questions || []).forEach(q => {
        const tid = q.topicId || "（無 topicId）";
        if (!bag[tid]) bag[tid] = { topicId: tid, score: 0, max: 0, attempts: 0, descs: new Set() };
        const raw = rec[q.id];
        if (raw === undefined || raw === null || String(raw).trim() === "") return;
        const sc = quizQuestionScore(q, raw);
        if (sc == null) return;
        bag[tid].score += sc;
        bag[tid].max += (q.max || 1);
        bag[tid].attempts += 1;
        if (q.topicDesc || q.desc) bag[tid].descs.add(q.topicDesc || q.desc);
      });
    });
    return Object.values(bag).map(t => ({
      ...t,
      pct: t.max > 0 ? (t.score / t.max) * 100 : null,
      descs: Array.from(t.descs)
    })).sort((a, b) => (a.pct ?? 999) - (b.pct ?? 999));
  }, [selectedQuizzes, visibleQuizzes, quizMaps, scores]);

  const weakItems = useMemo(() => {
    const items = [];
    const qids = selectedQuizzes.length ? selectedQuizzes : visibleQuizzes;
    qids.forEach(qid => {
      const map = quizMaps[qid];
      const rec = scores[qid];
      if (!map || !rec) return;
      (map.questions || []).forEach(q => {
        const raw = rec[q.id];
        if (raw === undefined || raw === null || String(raw).trim() === "") return;
        const sc = quizQuestionScore(q, raw);
        const max = q.max || 1;
        if (sc != null && sc < max * 0.5) items.push({ ...q, quizId: qid, score: sc, max });
      });
    });
    return items;
  }, [selectedQuizzes, visibleQuizzes, quizMaps, scores]);

  // 圖表：各小測得分率（每柱顯示該卷自己的 %，不再畫總體平均線）
  useEffect(() => {
    if (!chartRef.current || typeof Chart === "undefined") return;
    if (chartInst.current) { try { chartInst.current.destroy(); } catch(e) {} chartInst.current = null; }
    const labels = rows.map(r => r.qid);
    const dataPct = rows.map(r => r.pct == null ? 0 : Math.round(r.pct * 10) / 10);
    const dataScore = rows.map(r => r.total == null ? 0 : r.total);
    const dataMax = rows.map(r => r.max || 0);
    chartInst.current = new Chart(chartRef.current, {
      type: "bar",
      data: {
        labels,
        datasets: [
          {
            label: "該卷得分率 %",
            data: dataPct,
            yAxisID: "y",
            backgroundColor: rows.map(r => r.pct == null ? "#e2e8f0" : r.pct < 40 ? "#f87171" : r.pct < 60 ? "#fbbf24" : "#34d399"),
            borderRadius: 6,
            order: 2,
          },
          {
            label: "得分",
            data: dataScore,
            type: "line",
            yAxisID: "y1",
            borderColor: "#6366f1",
            backgroundColor: "#6366f1",
            tension: 0.2,
            order: 1,
          },
          {
            label: "滿分",
            data: dataMax,
            type: "line",
            yAxisID: "y1",
            borderColor: "#94a3b8",
            borderDash: [4, 4],
            pointRadius: 0,
            order: 0,
          },
        ]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        plugins: {
          legend: { position: "top" },
          tooltip: {
            callbacks: {
              afterBody: (items) => {
                const i = items[0]?.dataIndex;
                if (i == null || !rows[i]) return "";
                const r = rows[i];
                return r.total == null ? "未作答" : `分數 ${r.total}/${r.max}`;
              }
            }
          }
        },
        scales: {
          y: { min: 0, max: 100, position: "left", title: { display: true, text: "得分率 %" } },
          y1: { min: 0, position: "right", grid: { drawOnChartArea: false }, title: { display: true, text: "分數" } }
        }
      }
    });
    return () => { if (chartInst.current) { try { chartInst.current.destroy(); } catch(e) {} } };
  }, [rows]);

  const student = activeStudents.find(s => s.id === sid);

  const heatColor = (pct) => {
    if (pct == null) return "bg-slate-100 text-slate-400";
    if (pct < 40) return "bg-rose-500 text-white";
    if (pct < 60) return "bg-amber-400 text-slate-900";
    if (pct < 80) return "bg-lime-400 text-slate-900";
    return "bg-emerald-500 text-white";
  };

  const buildPrompt = () => {
    const qids = selectedQuizzes.length ? selectedQuizzes : visibleQuizzes;
    const weakList = weakItems.slice(0, 24).map(q => formatWeakItem(q, `小測 ${q.quizId}，得分 ${q.score}/${q.max}`)).join("\n")
      || "- （暫無弱項）";
    const topicIds = weakItems.map(q => q.topicId).filter(Boolean);
    const syllabus = getSyllabusTableText(topicIds);
    const scoreSummary = rows.filter(r => qids.includes(r.qid) && r.total != null)
      .map(r => `- ${r.qid} ${r.title}: ${r.total}/${r.max}（${Math.round(r.pct)}%）`).join("\n") || "- 尚無成績";
    const tasks = [];
    if (aiExtra.practice) tasks.push(`A. 針對性練習：${aiMc} MC + ${aiLq} LQ，難度「${aiLevel}」。每題標明 topicId。`);
    if (aiExtra.explainImg) tasks.push(`B. 解說圖描述，註明 topicId。`);
    if (aiExtra.ppt) tasks.push(`C. PPT 大綱 8–12 頁。`);
    if (aiExtra.notes) tasks.push(`D. 溫習筆記。`);
    if (!tasks.length) tasks.push(`A. 練習 ${aiMc} MC + ${aiLq} LQ。`);
    return `【身份】你是香港 DSE 物理科老師。

【任務】為學生 ${student ? `${student.class}-${student.num} ${student.name}` : sid} 生成個人化補底材料。

【納入的小測】${qids.join("、") || "（無）"}

【各小測表現】
${scoreSummary}

【個人弱點】（含 topicId）
${weakList}

【課程大綱參考】
${syllabus}

【產出要求】
${tasks.map((x,i)=>`${i+1}. ${x}`).join("\n")}

【其他】繁體中文；對應 topicId；直接給內容。`;
  };

  return (
    <div className="space-y-4">
      <div className="bg-white rounded-2xl border p-4 flex flex-wrap gap-3 items-center">
        <h2 className="font-bold text-lg">個人分析／表現圖表</h2>
        <select className="border rounded-lg px-3 py-1.5 text-sm font-semibold min-w-[200px]" value={sid} onChange={e=>setSid(e.target.value)}>
          {activeStudents.map(s => <option key={s.id} value={s.id}>{s.class}-{s.num} {s.name}</option>)}
        </select>
        {loading && <span className="text-xs text-slate-400">載入中…</span>}
      </div>

      <div className="grid lg:grid-cols-5 gap-4">
        <div className="lg:col-span-3 bg-white rounded-2xl border p-4">
          <div className="text-sm font-bold text-slate-700 mb-1">各小測得分率（柱）＋ 該卷得分／滿分（線）</div>
          <p className="text-xs text-slate-500 mb-2">每份小測獨立顯示，不再用「總體平均」一條線概括。</p>
          <div className="h-72 relative"><canvas ref={chartRef}></canvas></div>
        </div>
        <div className="lg:col-span-2 bg-white rounded-2xl border p-4 overflow-auto max-h-80">
          <div className="text-sm font-bold text-slate-600 mb-2">分數一覽</div>
          <table className="min-w-full text-xs">
            <thead className="bg-slate-50 sticky top-0">
              <tr>
                <th className="text-left px-2 py-1">小測</th>
                <th className="text-center px-2 py-1">分數</th>
                <th className="text-center px-2 py-1">得分率</th>
              </tr>
            </thead>
            <tbody>
              {rows.map(r => (
                <tr key={r.qid} className="border-t">
                  <td className="px-2 py-1"><span className="font-bold mono">{r.qid}</span></td>
                  <td className="px-2 py-1 text-center font-bold">{r.total == null ? "—" : `${r.total}/${r.max}`}</td>
                  <td className={`px-2 py-1 text-center font-bold ${r.pct==null?"text-slate-400":r.pct<40?"text-rose-600":r.pct<60?"text-amber-600":"text-emerald-600"}`}>
                    {r.pct == null ? "—" : Math.round(r.pct) + "%"}
                  </td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>
      </div>

      {/* Syllabus 熱力 */}
      <div className="bg-white rounded-2xl border p-5 space-y-3">
        <div className="flex flex-wrap justify-between gap-2 items-center">
          <div>
            <h3 className="font-bold text-lg">課題掌握熱力圖（Syllabus / Topic ID）</h3>
            <p className="text-xs text-slate-500">依所選小測彙總：紅＝難點（&lt;40%）、橙＝尚可（40–60%）、綠＝掌握（≥60%）</p>
          </div>
        </div>
        {!topicStats.length ? (
          <p className="text-slate-400 text-sm">此生在所選小測尚無帶 topicId 的作答數據</p>
        ) : (
          <div className="grid sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-2">
            {topicStats.map(t => {
              const info = SYLLABUS_TOPICS[t.topicId];
              const name = typeof info === "object" && info ? (info.topic || info.name || "") : (info || "");
              return (
                <div key={t.topicId} className={`rounded-xl p-3 border ${heatColor(t.pct)}`} title={(t.descs||[]).join("；")}>
                  <div className="font-black mono text-sm">{t.topicId}</div>
                  <div className="text-xs font-semibold opacity-90 truncate">{name}</div>
                  <div className="text-xl font-black mt-1">{t.pct == null ? "—" : Math.round(t.pct) + "%"}</div>
                  <div className="text-[10px] opacity-80">{t.score.toFixed(1)}/{t.max} · {t.attempts} 題</div>
                </div>
              );
            })}
          </div>
        )}
        <div className="flex flex-wrap gap-3 text-xs font-bold text-slate-600">
